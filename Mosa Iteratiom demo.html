      <div class="checks compact">${exChecks.slice(0, 4).map(c => `<div class="check"><span class="ic ${tone(c.status)}">${ic(toneIcon(c.status))}</span><div><div class="t">${esc(c.label)}</div><div class="d">${esc(c.detail)}</div></div><span class="w">${c.weight}</span></div>`).join('')}</div>
      <div class="minis">${exSkills.map(s => `<span class="tag seal">${ic('check')}${esc(s)}</span>`).join('')}</div>
    </aside>` : ''}
  </section>
  <section class="weights">
    <div class="weights-h"><h2>What verification checks</h2><p class="help">Pass counts in full, a warning counts half. ${MOCK.rules?.verified_threshold ?? 70}+ is verified, ${MOCK.rules?.partial_threshold ?? 40}–${(MOCK.rules?.verified_threshold ?? 70) - 1} is partly verified.</p></div>
    <div class="wgrid">${(MOCK.checks || []).map(c => `<div class="wcell"><b class="num">${c.weight}</b><span>${esc(c.label)}</span></div>`).join('')}</div>
  </section>`;
};

pages.status = () => {
  const p = S.project;
  const langs = Object.entries(p.languages || {});
  const t = S.task;
  const running = t && t.status === 'running';
  const isDone = verified();
  const nVal = v => v == null ? '—' : Number(v).toLocaleString('en-GB');
  const checks = isDone || running ? S.checks : [];
  const all = (MOCK.checks || []);
  const checkRows = all.map(c => {
    const got = checks.find(x => x.id === c.id);
    if (!got) return `<div class="check pending"><span class="ic idle">${running ? '<span class="spin" style="width:12px;height:12px;border-width:1.5px"></span>' : ic('info')}</span><div><div class="t">${esc(c.label)}</div><div class="d">${running ? 'Waiting…' : 'Not checked yet'}</div></div><span class="w">${c.weight}</span></div>`;
    return `<div class="check"><span class="ic ${tone(got.status)}">${ic(toneIcon(got.status))}</span><div><div class="t">${esc(got.label)}</div><div class="d">${esc(got.detail)}</div></div><span class="w">${got.weight}</span></div>`;
  }).join('');
  const res = t?.result;
  return `
  <div class="head">
    <div><span class="eyebrow">Step 2 · Project status</span><h1 style="font-size:clamp(26px,3.4vw,36px)">${esc(p.title)}</h1>
      <div class="row"><a class="mono" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.owner)}/${esc(p.name)} ${ic('ext', 'style="width:13px;height:13px;vertical-align:-1px"')}</a>${statusPill(isDone ? res.verdict : running ? 'verifying' : 'submitted')}</div></div>
    <div class="row">${btn('Submit another', { kind: 'ghost', act: 'reset-project', size: 'btn-sm' })}</div>
  </div>
  <section class="panel">
    ${p.description ? `<p class="muted">${esc(p.description)}</p>` : ''}
    <div class="stats">
      <div class="stat"><b>${nVal(p.stars)}</b><span>Stars</span></div>
      <div class="stat"><b>${nVal(p.forks)}</b><span>Forks</span></div>
      <div class="stat"><b>${nVal(p.commits)}</b><span>Commits</span></div>
      <div class="stat"><b>${nVal(p.active_days)}</b><span>Active days</span></div>
      <div class="stat"><b>${nVal(p.contributors)}</b><span>Contributors</span></div>
      <div class="stat"><b style="font-size:15px;line-height:1.9">${fmtDate(p.last_push)}</b><span>Last push</span></div>
    </div>
    ${langs.length ? `<div style="display:flex;flex-direction:column;gap:8px"><div class="langbar">${langs.map(([l, v], i) => `<i style="width:${v}%;background:${LANG_COLORS[i % LANG_COLORS.length]}" title="${esc(l)} ${v}%"></i>`).join('')}</div><div class="legend">${langs.map(([l, v], i) => `<span><i style="background:${LANG_COLORS[i % LANG_COLORS.length]}"></i>${esc(l)} <span class="faint num">${v}%</span></span>`).join('')}</div></div>` : ''}
  </section>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Verification</h2>${running ? `<span class="mono faint num">${t.progress}%</span>` : ''}</div>
      ${!t && !S.pending.verify ? `<p class="muted">Verification reads the repository, scores eight checks and stores the evidence. It takes a few seconds.</p>` : ''}
      ${running || S.pending.verify ? `<div style="display:flex;flex-direction:column;gap:8px"><div class="progress"><i style="width:${t?.progress || 2}%"></i></div><span class="help">${esc(t?.step || 'Queuing verification…')}</span></div>` : ''}
      ${errorBox('verify', 'start-verification')}
      <div class="checks">${checkRows}</div>
    </section>
    <aside class="panel raised">
      ${isDone ? `
        <div class="score"><div class="ring" style="--v:${res.score};--c:${ringColor(res.score)}"><b>${res.score}</b></div>
          <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Trust score</span>${statusPill(res.verdict)}<p class="help">${checks.filter(c => c.status === 'pass').length} of ${checks.length} checks passed</p></div></div>
        <p class="muted">${res.verdict === 'verified' ? 'The evidence supports your project. The interview will test how well you can explain it.' : 'Some checks need attention. The interview will ask about them first, so prepare answers.'}</p>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${btn(S.interviewDone ? 'Review AI Interview' : 'Continue to AI Interview', { act: 'go', data: 'data-to="interview"', icon: 'mic', size: 'btn-lg' })}
          ${btn('View Verification Report', { kind: 'secondary', act: 'view-report', icon: 'report' })}
          ${btn('Run again', { kind: 'ghost', act: 'start-verification', icon: 'refresh', size: 'btn-sm' })}
        </div>` : `
        <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Next step</span><h3>Verify ${esc(p.owner)}/${esc(p.name)}</h3><p class="muted">After verification you can take the AI interview and unlock your skills.</p></div>
        ${btn(running || S.pending.verify ? 'Verifying…' : 'Start Verification', { act: 'start-verification', icon: 'play', size: 'btn-lg', busy: running || S.pending.verify })}`}
    </aside>
  </div>`;
};

pages.interview = () => {
  if (S.pending.interview && !S.session) return `<div class="panel" style="gap:14px"><div class="sk" style="height:22px;width:40%"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:180px"></div></div>`;
  if (!S.session) return `<div class="empty">${ic('mic')}<h3>Interview not started</h3>${errorBox('interview')}${btn('Start interview', { act: 'start-interview', icon: 'play' })}</div>`;
  const total = S.session.total, n = S.answers.length, i = S.view;
  const dims = n ? avgDims(S.answers) : null;
  const busy = S.pending.answer;
  const min = MOCK.rules?.min_answer_chars ?? 20;
  const q = cq() || { type: 'text', text: '' };
  const done = answerAt(i);
  const isChoice = q.type === 'choice';
  const draft = S.drafts[i] || '';
  const len = draft.trim().length;
  const pick = S.choices[i];
  const canSubmit = isChoice ? !!pick : len >= min;
  const left = S.session.questions.map((_, k) => k).filter(k => !answerAt(k));
  const guide = isChoice
    ? { h: 'Best practice · scenario questions', items: ['Read every option before choosing.', 'Pick the one you could defend to your team with evidence.', 'Weigh risk, cost and time, not only speed.'] }
    : { h: 'Best practice · short answers', items: ['Lead with a one-sentence answer.', 'Back it with one number, test result or user quote.', 'Name a trade-off: what you rejected and why.'] };
  const review = a => {
    const ch = a.feedback.choice;
    const body = a.question.type === 'choice' && ch
      ? `<div class="options review">${a.question.options.map((o, k) => {
          const mine = o.id === ch.picked, best = o.id === ch.best;
          return `<div class="opt ${mine ? 'mine' : ''} ${best ? 'best' : ''}"><span class="key">${String.fromCharCode(65 + k)}</span><span class="txt">${esc(o.text)}${mine || best ? `<span class="optnote">${mine && best ? 'Your choice · strongest answer' : mine ? 'Your choice' : 'Strongest answer'}</span>` : ''}</span><span aria-hidden="true">${best ? ic('check', 'style="width:18px;height:18px;color:var(--ok)"') : mine ? ic('alert', 'style="width:18px;height:18px;color:var(--warn)"') : ''}</span></div>`;
        }).join('')}</div>`
      : `<div class="field"><span class="eyebrow">Your answer</span><div class="a">${esc(a.answer)}</div></div>`;
    return `<div class="row" style="justify-content:space-between"><span class="pill ok"><i></i>Answered</span><span class="pill ${a.feedback.score >= 70 ? 'ok' : a.feedback.score >= 50 ? 'warn' : 'bad'}">${a.feedback.score} / 100</span></div>
      ${body}
      <div class="minis">${Object.entries(a.feedback.scores).map(([k, v]) => `<span class="tag">${dimLabel[k]} <b class="num">${v}</b>/5</span>`).join('')}</div>
      <div class="tip">${ic('bulb')}<span>${esc(a.feedback.tip)}</span></div>`;
  };
  return `
  <div class="head"><div><span class="eyebrow">Step 3 · AI interview</span><h1 style="font-size:clamp(26px,3.4vw,36px)">Defend ${esc(S.project.title)}</h1><p class="muted">${total} questions, mixing short answers and scenario choices. Browse them in any order; the first ones focus on what verification flagged.</p></div>
    <span class="mono faint num">${n} of ${total} answered</span></div>
  <div class="grid2">
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      ${S.interviewDone ? `
        <section class="panel raised">
          <div class="score"><div class="ring" style="--v:${S.project.interviewScore};--c:${ringColor(S.project.interviewScore)}"><b>${S.project.interviewScore}</b></div>
          <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Interview complete</span><h2>You answered all ${total} questions</h2><p class="muted">Your report and skills are ready. Use the question bar below to review any answer.</p></div></div>
          <div class="row">${btn('View Verification Report', { act: 'view-report', icon: 'report' })}${btn('View Verified Skills', { kind: 'secondary', act: 'view-skills', icon: 'seal' })}${btn('Practise again', { kind: 'ghost', act: 'restart-interview', icon: 'refresh', size: 'btn-sm' })}</div>
        </section>` : ''}
      <section class="qcard" aria-labelledby="qText">
        <nav class="qnav" aria-label="Questions">${S.session.questions.map((qq, k) => {
          const st = answerAt(k) ? 'answered' : (S.drafts[k]?.trim() || S.choices[k]) ? 'draft' : '';
          return `<button type="button" id="qstep-${k}" class="qstep ${k === i ? 'on' : ''} ${st}" data-act="q-go" data-i="${k}" ${k === i ? 'aria-current="step"' : ''} aria-label="Question ${k + 1}, ${qq.type === 'choice' ? 'multiple choice' : 'short answer'}${answerAt(k) ? ', answered' : ''}"><b>${k + 1}</b>${answerAt(k) ? ic('check') : `<i class="qdot ${qq.type}"></i>`}</button>`;
        }).join('')}</nav>
        <div class="qhead">
          <div class="qhead-l"><span class="eyebrow">Question ${i + 1} of ${total}</span><span class="qtype">${ic(isChoice ? 'list' : 'pen')}${isChoice ? 'Multiple choice' : 'Short answer'}</span></div>
          <span class="qnum" aria-hidden="true">${i + 1}<span> / ${total}</span></span>
        </div>
        <p class="qtext" id="qText">${esc(q.text)}</p>
      </section>
      <section class="panel">
        ${done ? review(done) : isChoice ? `
        <fieldset class="options" ${busy ? 'disabled' : ''}>
          <legend>Choose one answer</legend>
          ${q.options.map((o, k) => `<label class="opt"><input type="radio" name="choice" id="opt-${o.id}" value="${esc(o.id)}" ${pick === o.id ? 'checked' : ''}><span class="key">${String.fromCharCode(65 + k)}</span><span class="txt">${esc(o.text)}</span><span class="radio" aria-hidden="true"></span></label>`).join('')}
        </fieldset>
        <span class="help">Press A–${String.fromCharCode(64 + q.options.length)} to choose, Enter to submit.</span>` : `
        <div class="field">
          <label for="answer">Your answer</label>
          <textarea id="answer" class="ta" placeholder="Answer as you would out loud. Specific numbers and examples score higher." ${busy ? 'disabled' : ''}>${esc(draft)}</textarea>
          <div class="row" style="justify-content:space-between"><span class="help num" id="charCount">${len} characters${len < min ? ` · ${min - len} more needed` : ''}</span><span class="help">Ctrl + Enter to submit</span></div>
        </div>`}
        ${done ? '' : errorBox('answer')}
        <div class="qfoot">
          ${btn('Previous', { kind: 'secondary', act: 'q-prev', icon: 'back', disabled: i === 0 || busy, id: 'qPrev' })}
          <span class="grow">${done ? '' : btn(busy ? 'Scoring…' : 'Submit Answer', { act: 'submit-answer', icon: 'send', busy, disabled: !canSubmit, id: 'submitAnswer' })}</span>
          ${i < total - 1 ? `<button type="button" id="qNext" class="btn btn-secondary" data-act="q-next" ${busy ? 'disabled' : ''}><span>${done || S.interviewDone ? 'Next' : 'Skip for now'}</span>${ic('arrow')}</button>`
            : left.length && !(left.length === 1 && left[0] === i) ? `<button type="button" class="btn btn-secondary" data-act="q-open" ${busy ? 'disabled' : ''}><span>Go to unanswered</span>${ic('arrow')}</button>` : '<span></span>'}
        </div>
        ${!S.interviewDone && left.length ? `<p class="help">${left.length === 1 ? 'One question left' : `${left.length} questions left`}: ${left.map(k => `<button type="button" class="linkbtn" data-act="q-go" data-i="${k}">Q${k + 1}</button>`).join(', ')}. Your drafts are kept while you browse.</p>` : ''}
      </section>
    </div>
    <aside class="panel">
      <div class="panel-h"><h3>Running scores</h3><span class="eyebrow">Avg / 5</span></div>
      ${dims ? `<div class="dims">${Object.entries(dims).map(([k, v]) => `<div class="dim"><span>${dimLabel[k]}</span><span class="bar"><i style="width:${v / 5 * 100}%"></i></span><b class="num">${v.toFixed(1)}</b></div>`).join('')}</div>` : `<p class="help">Scores appear after your first answer. Each answer is rated 1–5 on clarity, evidence, depth and relevance.</p>`}
      <div class="qmap">${S.session.questions.map((_, k) => { const a = answerAt(k); return `<button type="button" class="qmap-i ${k === i ? 'on' : ''}" data-act="q-go" data-i="${k}"><span class="mono">Q${k + 1}</span><span class="bar"><i style="width:${a ? a.feedback.score : 0}%"></i></span><b class="num">${a ? a.feedback.score : '—'}</b></button>`; }).join('')}</div>
      <div class="guide"><div class="guide-h">${ic('bulb')}${guide.h}</div><ol>${guide.items.map(x => `<li>${x}</li>`).join('')}</ol></div>
      <p class="help">Use ← and → to move between questions.</p>
    </aside>
  </div>`;
};

pages.proof = () => {
  const tabs = `<div class="tabs" role="tablist">
    <button type="button" class="btn btn-ghost ${S.tab === 'report' ? 'on' : ''}" role="tab" aria-selected="${S.tab === 'report'}" data-act="view-report">${ic('report')}<span>View Verification Report</span></button>
    <button type="button" class="btn btn-ghost ${S.tab === 'skills' ? 'on' : ''}" role="tab" aria-selected="${S.tab === 'skills'}" data-act="view-skills">${ic('seal')}<span>View Verified Skills</span></button></div>`;
  return `
  <div class="head"><div><span class="eyebrow">Step 4 · Verification & skills</span><h1 style="font-size:clamp(26px,3.4vw,36px)">${esc(S.project.title)}</h1></div>${tabs}</div>
  ${S.tab === 'report' ? reportView() : skillsView()}`;
};

function reportView() {
  if (S.pending.report && !S.report) return `<div class="kpis">${[0, 1, 2].map(() => '<div class="sk" style="height:120px"></div>').join('')}</div><div class="sk" style="height:300px"></div>`;
  if (!S.report) return `<div class="empty">${ic('report')}<h3>Report unavailable</h3>${errorBox('report', 'load-report')}</div>`;
  const r = S.report;
  const kpi = (label, v, note) => `<div class="kpi"><div class="ring sm" style="--v:${v ?? 0};--c:${v == null ? 'var(--sunk)' : ringColor(v)}"><b>${v ?? '–'}</b></div><div><span class="eyebrow">${label}</span><small>${note}</small></div></div>`;
  return `
  ${errorBox('report', 'load-report')}
  <div class="kpis">
    ${kpi('Trust score', r.trust, 'From repository evidence')}
    ${kpi('Interview', r.interview, r.interview == null ? 'Not taken yet' : 'Average across answers')}
    ${kpi('Readiness', r.readiness, r.readiness == null ? 'Needs the interview' : '60% interview + 40% trust')}
  </div>
  <div class="verdict ${verdictTone(r.verdict)}">${ic(r.verdict === 'verified' ? 'seal' : 'alert')}<div><b>${r.verdict === 'verified' ? 'Verified project' : r.verdict === 'partial' ? 'Partly verified' : 'Not verified'}</b><p>${r.verdict === 'verified' ? 'The repository history supports the project description.' : 'Some evidence is missing. Fix the flagged checks and run verification again.'}</p></div></div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Checks</h2><span class="mono faint">${esc(r.report_id)}</span></div>
      <div class="checks">${r.checks.map(c => `<div class="check"><span class="ic ${tone(c.status)}">${ic(toneIcon(c.status))}</span><div><div class="t">${esc(c.label)}</div><div class="d">${esc(c.detail)}</div></div><span class="w">${c.weight}</span></div>`).join('')}</div>
      <p class="help">Generated ${new Date(r.generated_at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}</p></section>
    <aside class="panel">
      <h3>Interview breakdown</h3>
      ${r.dims ? `<div class="dims">${Object.entries(r.dims).map(([k, v]) => `<div class="dim"><span>${dimLabel[k]}</span><span class="bar"><i style="width:${v / 5 * 100}%"></i></span><b class="num">${Number(v).toFixed(1)}</b></div>`).join('')}</div>` : `<p class="help">Take the AI interview to add your communication scores to this report.</p>${btn('Go to AI Interview', { kind: 'secondary', act: 'go', data: 'data-to="interview"', icon: 'mic' })}`}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">${btn('View Verified Skills', { act: 'view-skills', icon: 'seal' })}${btn('Refresh report', { kind: 'ghost', act: 'load-report', icon: 'refresh', size: 'btn-sm', busy: S.pending.report })}</div>
    </aside>
  </div>`;
}

const stamp = () => `<svg class="stamp" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3"/><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2"/><path d="M17.5 24.5l4.5 4.5 8.5-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function skillsView() {
  if (S.pending.skills && !S.skills) return `<div class="skills">${[0, 1, 2, 3].map(() => '<div class="sk" style="height:180px"></div>').join('')}</div>`;
  if (!S.skills) return `<div class="empty">${ic('seal')}<h3>Skills unavailable</h3>${errorBox('skills', 'load-skills')}</div>`;
  const v = S.skills.filter(s => s.verified), u = S.skills.filter(s => !s.verified);
  const card = s => `<article class="skill ${s.verified ? 'verified' : 'unverified'}">${stamp()}
    <span class="eyebrow">${esc(s.category)}</span><h3>${esc(s.name)}</h3>
    <div class="lv" aria-label="Level ${s.level} of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= s.level ? 'on' : ''}"></i>`).join('')}</div>
    ${s.evidence?.length ? `<ul class="ev">${s.evidence.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${s.verified ? `<span class="tag seal">${ic('check')}Verified</span>` : `<p class="help">${esc(s.reason)}</p>`}</article>`;
  return `
  ${errorBox('skills', 'load-skills')}
  <div class="panel-h"><div><h2>${v.length} verified skill${v.length === 1 ? '' : 's'}</h2><p class="help">Each skill links to the evidence behind it.</p></div>${btn('Find Collaborators', { act: 'find-collaborators', icon: 'users', size: 'btn-lg', disabled: !v.length })}</div>
  ${v.length ? `<div class="skills">${v.map(card).join('')}</div>` : `<div class="empty">${ic('seal')}<h3>No verified skills yet</h3><p class="muted">Raise your trust score or complete the interview to verify skills.</p></div>`}
  ${u.length ? `<h3 style="margin-top:8px">Not verified yet</h3><div class="skills">${u.map(card).join('')}</div>` : ''}`;
}

pages.match = () => {
  const m = S.matching;
  const busyM = S.pending.matching;
  const list = S.collaborators;
  const all = list ? [...new Set(list.flatMap(c => c.skills))].sort() : [];
  const shown = list ? list.filter(c => S.filter === 'All' || c.skills.includes(S.filter)) : [];
  const joined = !!m?.joined;
  return `
  <div class="head"><div><span class="eyebrow">Step 5 · Find collaborators</span><h1 style="font-size:clamp(26px,3.4vw,36px)">Students who complement your skills</h1>
    <p class="muted">Ranked by what they bring that you are looking for (${(MOCK.user?.seeking || []).map(esc).join(', ')}) and what they need that you have verified.</p></div></div>
  <section class="mstatus ${joined ? 'on' : ''}">
    <span class="beacon"></span>
    <div class="grow"><b>${!m ? 'Checking your matching status…' : joined ? 'You are in matching' : 'You are not in matching'}</b>
      <span class="help">${!m ? '' : joined ? `Your verified skills are visible to ${m.visible_to} student${m.visible_to === 1 ? '' : 's'}. You can request introductions.` : 'Join to show your verified skills to other students and request introductions.'}</span></div>
    ${m ? btn(busyM ? (joined ? 'Leaving…' : 'Joining…') : joined ? 'Leave Matching' : 'Join Matching', { kind: joined ? 'danger' : 'primary', act: 'toggle-matching', icon: joined ? 'logout' : 'login', busy: busyM }) : '<span class="spin"></span>'}
  </section>
  ${errorBox('matching', 'load-matching')}
  ${errorBox('collaborators', 'load-matching')}
  ${list ? `<div class="row">${['All', ...all].map(f => `<button type="button" class="chip ${S.filter === f ? 'on' : ''}" data-act="filter" data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div>` : ''}
  ${S.pending.collaborators && !list ? `<div class="people">${[0, 1, 2, 3].map(() => '<div class="sk" style="height:230px"></div>').join('')}</div>` : ''}
  ${list && !shown.length ? `<div class="empty">${ic('users')}<h3>No one matches this filter</h3>${btn('Show everyone', { kind: 'secondary', act: 'filter', data: 'data-f="All"' })}</div>` : ''}
  ${shown.length ? `<div class="people">${shown.map(c => {
    const st = S.intros[c.handle];
    const initials = c.name.split(/\s+/).map(w => w[0]).slice(0, 2).join('');
    return `<article class="person">
      <div class="person-h"><span class="avatar" style="background:hsl(${c.hue ?? hash(c.handle) % 360} 55% 45%)">${esc(initials)}</span>
        <div><div class="n">${esc(c.name)}</div><div class="help">${esc(c.club)}</div></div>
        <div class="match" style="color:${ringColor(c.match)}">${c.match}%<small>MATCH</small></div></div>
      <div class="kv"><span>Brings</span><div class="minis">${c.skills.map(s => `<span class="tag ${c.brings.includes(s) ? 'hl' : ''}">${esc(s)}</span>`).join('')}</div></div>
      <div class="kv"><span>Looking for</span><div class="minis">${c.seeking.map(s => `<span class="tag ${c.needs.includes(s) ? 'seal' : ''}">${c.needs.includes(s) ? ic('check') : ''}${esc(s)}</span>`).join('')}</div></div>
      <div class="kv"><span>Working on</span><div>${esc(c.project)} <span class="faint">· ${esc(c.availability)}</span></div></div>
      <div>${st === 'requested' ? `<button class="btn btn-secondary" disabled>${ic('check')}<span>Introduction requested</span></button>` :
        btn(st === 'pending' ? 'Sending…' : 'Request intro', { kind: 'secondary', act: 'intro', data: `data-h="${esc(c.handle)}"`, icon: 'send', busy: st === 'pending', disabled: !joined })}
        ${!joined ? '<span class="help" style="margin-left:8px">Join matching first</span>' : ''}</div>
    </article>`;
  }).join('')}</div>` : ''}`;
};

function render() {
  renderTop();
  const v = $('#view');
  const focusId = document.activeElement?.id;
  const sel = focusId && document.activeElement.selectionStart != null ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  v.innerHTML = (pages[S.route] || pages.home)();
  if (focusId) { const el = document.getElementById(focusId); if (el && !el.disabled) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(...sel); } catch (e) {} } }
  if (S.dev) renderDevState();
}
function renderToasts() {
  $('#toasts').innerHTML = S.toasts.map(t => `<div class="toast ${t.kind}" role="${t.kind === 'error' ? 'alert' : 'status'}">${ic(t.kind === 'success' ? 'check' : t.kind === 'error' ? 'alert' : 'info')}<span>${esc(t.text)}</span></div>`).join('');
}

async function submitProject() {
  const url = S.urlDraft.trim();
  if (!url) { setState({ urlError: 'Paste the URL of your GitHub repository.' }); $('#repoUrl')?.focus(); return; }
  if (!parseRepoUrl(url)) { setState({ urlError: 'That doesn’t look like a repository URL. Use https://github.com/owner/repository.' }); $('#repoUrl')?.focus(); return; }
  S.urlError = '';
  await run('submit', async () => {
    const p = await api.submitProject({ url });
    Object.assign(S, { project: p, task: null, checks: [], session: null, view: 0, drafts: {}, choices: {}, answers: [], interviewDone: false, report: null, skills: null, collaborators: null, intros: {} });
    toast('success', `Project ${p.owner}/${p.name} submitted.`);
    S.route = 'status'; try { history.replaceState(null, '', '#status'); } catch (e) {}
  });
}
async function startVerification() {
  if (S.pending.verify || S.task?.status === 'running') return;
  Object.assign(S, { task: null, checks: [], report: null, skills: null, collaborators: null });
  await run('verify', async () => {
    let t = await api.startVerification(S.project.id);
    S.task = t; S.project.status = 'verifying'; render();
    let misses = 0;
    while (t.status !== 'done') {
      await sleep(450);
      try { t = await api.getTask(t.id); misses = 0; }
      catch (e) { if (e.code === 'task_failed' || ++misses >= 3) { S.task = null; throw e; } continue; }
      S.task = t; S.checks = t.checks || []; render();
    }
    S.task = t; S.checks = t.checks; S.project.status = t.result.verdict; S.project.trust = t.result.score;
    toast('success', `Verification finished: trust score ${t.result.score}.`);
  });
}
const cq = () => S.session?.questions?.[S.view] || null;
const answerAt = i => S.answers.find(a => a.index === i) || null;
const nextOpen = from => { const t = S.session?.total || 0; for (let k = 1; k <= t; k++) { const i = (from + k) % t; if (!answerAt(i)) return i; } return null; };
function viewQ(i) {
  const t = S.session?.total || 0;
  if (i < 0 || i >= t || i === S.view) return;
  S.view = i; S.errors = { ...S.errors, answer: null }; render();
}
async function startInterview() {
  await run('interview', async () => {
    const s = await api.startInterview(S.project.id);
    Object.assign(S, { session: s, view: 0, drafts: {}, choices: {}, answers: [], interviewDone: false });
  });
}
async function submitAnswer() {
  const i = S.view, q = cq();
  if (!q || answerAt(i)) return;
  const isChoice = q.type === 'choice';
  const text = (S.drafts[i] || '').trim();
  const pick = S.choices[i];
  const min = MOCK.rules?.min_answer_chars ?? 20;
  if (isChoice && !pick) { S.errors = { ...S.errors, answer: 'Pick one of the options before submitting.' }; render(); return; }
  if (!isChoice && text.length < min) { S.errors = { ...S.errors, answer: `Write at least ${min} characters so the interviewer has something to assess.` }; render(); return; }
  await run('answer', async () => {
    const payload = isChoice ? { index: i, choice: pick, choiceText: q.options.find(o => o.id === pick)?.text } : { index: i, text };
    if (S.session.sequential) payload.expectedIndex = S.answers.length;
    const r = await api.submitAnswer(S.session.id, payload);
    S.answers = [...S.answers, { index: i, question: q, answer: isChoice ? payload.choiceText : text, feedback: r.feedback }].sort((a, b) => a.index - b.index);
    delete S.drafts[i]; delete S.choices[i];
    if (r.done || S.answers.length >= S.session.total) {
      S.interviewDone = true;
      S.project.interviewScore = Math.round(S.answers.reduce((a, x) => a + x.feedback.score, 0) / S.answers.length);
      S.report = null; S.skills = null; S.collaborators = null;
      toast('success', 'Interview complete. Your report is ready.');
    } else {
      toast('success', `Question ${i + 1} scored ${r.feedback.score} / 100.`);
      const n = nextOpen(i); if (n != null) S.view = n;
    }
  });
}
async function loadReport() { await run('report', async () => { S.report = await api.getReport(S.project.id, S.interviewDone ? S.session?.id : null); }); }
async function loadSkills() { await run('skills', async () => { S.skills = await api.getSkills(S.project.id); }); }
async function loadMatching() {
  const tasks = [];
  if (!S.matching || S.errors.matching) tasks.push(run('matching', async () => { S.matching = await api.getMatching(); }));
  if (!S.collaborators || S.errors.collaborators) tasks.push(run('collaborators', async () => {
    if (!S.skills) S.skills = await api.getSkills(S.project.id);
    S.collaborators = await api.getCollaborators(S.skills.filter(s => s.verified).map(s => s.name));
  }));
  await Promise.all(tasks);
}
async function toggleMatching() {
  const next = !S.matching?.joined;
  await run('matching', async () => {
    S.matching = await api.setMatching(next);
    if (!next) S.intros = {};
    toast('success', next ? 'You joined matching.' : 'You left matching. Your skills are hidden.');
  });
}
async function requestIntro(handle) {
  S.intros = { ...S.intros, [handle]: 'pending' }; render();
  try { await api.requestIntro(handle); S.intros = { ...S.intros, [handle]: 'requested' }; toast('success', 'Introduction requested.'); }
  catch (e) { const { [handle]: _, ...rest } = S.intros; S.intros = rest; toast('error', e.message); }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === 'submit-project') { e.preventDefault(); submitProject(); }
  else if (a === 'go') go(el.dataset.to);
  else if (a === 'sample') { S.urlDraft = el.dataset.url; S.urlError = ''; render(); $('#repoUrl')?.focus(); }
  else if (a === 'reset-project') { Object.assign(S, { project: null, task: null, checks: [], session: null, answers: [], interviewDone: false, report: null, skills: null, collaborators: null, urlDraft: '', errors: {} }); go('home'); }
  else if (a === 'start-verification') startVerification();
  else if (a === 'start-interview') startInterview();
  else if (a === 'restart-interview') { S.session = null; S.interviewDone = false; S.answers = []; S.drafts = {}; S.choices = {}; S.view = 0; startInterview(); }
  else if (a === 'q-go') viewQ(+el.dataset.i);
  else if (a === 'q-prev') viewQ(S.view - 1);
  else if (a === 'q-next') viewQ(S.view + 1);
  else if (a === 'q-open') { const n = nextOpen(S.view); if (n != null) viewQ(n); }
  else if (a === 'submit-answer') submitAnswer();
  else if (a === 'view-report') { S.tab = 'report'; if (S.route !== 'proof') go('proof'); else { render(); if (!S.report) loadReport(); } }
  else if (a === 'view-skills') { S.tab = 'skills'; if (S.route !== 'proof') go('proof'); else { render(); if (!S.skills) loadSkills(); } }
  else if (a === 'load-report') { S.report = null; loadReport(); }
  else if (a === 'load-skills') loadSkills();
  else if (a === 'find-collaborators') go('match');
  else if (a === 'toggle-matching') toggleMatching();
  else if (a === 'load-matching') { S.errors = { ...S.errors, matching: null, collaborators: null }; S.matching = S.matching || null; loadMatching(); }
  else if (a === 'filter') { S.filter = el.dataset.f; render(); }
  else if (a === 'intro') requestIntro(el.dataset.h);
  else if (a === 'dev-open') openDev();
  else if (a === 'dev-close') closeDev();
  else if (a === 'dev-tab') { S.devTab = el.dataset.tab; renderDev(); }
  else if (a === 'dev-apply') applyMock();
  else if (a === 'dev-reset') resetMock();
  else if (a === 'dev-copy') copyMock();
  else if (a === 'dev-mode') { SETTINGS.mode = el.dataset.mode; saveSettings(); renderDev(); render(); toast('info', SETTINGS.mode === 'live' ? `Live API mode: requests go to ${SETTINGS.baseUrl}.` : 'Mock mode: requests use the local mock data.'); }
  else if (a === 'dev-session') { resetSession(); toast('success', 'Session cleared.'); }
});
document.addEventListener('submit', e => { if (e.target.id === 'submitForm') { e.preventDefault(); submitProject(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'repoUrl') { S.urlDraft = t.value; if (S.urlError) { S.urlError = ''; t.closest('.input')?.classList.remove('err'); const h = $('#repoHelp'); if (h) { h.className = 'help'; h.textContent = 'Public repositories only. We read metadata and commits; we never change anything.'; } } }
  if (t.id === 'answer') {
    S.drafts[S.view] = t.value;
    const nb = document.querySelector(`.qstep[data-i="${S.view}"]`); if (nb) nb.classList.toggle('draft', !!t.value.trim());
    const min = MOCK.rules?.min_answer_chars ?? 20, len = t.value.trim().length;
    const c = $('#charCount'); if (c) c.textContent = `${len} characters${len < min ? ` · ${min - len} more needed` : ''}`;
    const b = $('#submitAnswer'); if (b && !S.pending.answer) b.disabled = len < min;
  }
  if (t.name === 'choice') {
    S.choices[S.view] = t.value;
    const nb = document.querySelector(`.qstep[data-i="${S.view}"]`); if (nb) nb.classList.add('draft');
    if (S.errors.answer) { S.errors = { ...S.errors, answer: null }; render(); return; }
    const b = $('#submitAnswer'); if (b && !S.pending.answer) b.disabled = false;
  }
  if (t.id === 'devLatency') { SETTINGS.latency = +t.value; $('#devLatencyOut').textContent = t.value + ' ms'; saveSettings(); }
  if (t.id === 'devFail') { SETTINGS.failRate = +t.value; $('#devFailOut').textContent = t.value + '%'; saveSettings(); }
  if (t.id === 'devBase') { SETTINGS.baseUrl = t.value.trim(); saveSettings(); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'answer' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitAnswer(); }
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName) && e.target.name !== 'choice';
  if (S.route === 'interview' && S.session && !S.dev && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (e.key === 'ArrowRight' && e.target.name !== 'choice') { e.preventDefault(); viewQ(S.view + 1); return; }
    if (e.key === 'ArrowLeft' && e.target.name !== 'choice') { e.preventDefault(); viewQ(S.view - 1); return; }
    const q = cq();
    if (q?.type === 'choice' && !answerAt(S.view) && !S.pending.answer) {
      const k = e.key.toUpperCase();
      const idx = k.length === 1 ? k.charCodeAt(0) - 65 : -1;
      if (idx >= 0 && idx < q.options.length) { const el = document.getElementById('opt-' + q.options[idx].id); if (el) { el.checked = true; el.dispatchEvent(new Event('input', { bubbles: true })); el.focus(); } }
      else if (e.key === 'Enter' && S.choices[S.view]) { e.preventDefault(); submitAnswer(); }
    }
  }
  if (e.key === 'Escape' && S.dev) closeDev();
});

function saveSettings() { ls.set('mosa.settings', SETTINGS); }
function resetSession() {
  DB.projects = {}; DB.tasks = {}; DB.sessions = {}; DB.matching = { joined: false, since: null };
  Object.assign(S, { route: 'home', urlDraft: '', urlError: '', project: null, task: null, checks: [], session: null, view: 0, drafts: {}, choices: {}, answers: [], interviewDone: false, report: null, skills: null, tab: 'report', matching: null, collaborators: null, filter: 'All', intros: {}, pending: {}, errors: {} });
  try { history.replaceState(null, '', '#home'); } catch (e) {}
  render();
}
function openDev() { S.dev = true; renderDev(); }
function closeDev() { S.dev = false; $('#devtools').innerHTML = ''; $('[data-act="dev-open"]')?.focus(); }
function renderDev() {
  const t = S.devTab;
  $('#devtools').innerHTML = `<div class="scrim" data-act="dev-close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="devTitle">
    <div class="drawer-h">${ic('db', 'style="width:22px;height:22px"')}<h2 id="devTitle">Mock Data</h2><button class="btn btn-ghost btn-sm" data-act="dev-close" aria-label="Close">${ic('x')}</button></div>
    <div class="drawer-b">
      <div class="tabs" role="tablist">${[['data', 'Mock JSON'], ['settings', 'API settings'], ['state', 'App state']].map(([k, l]) => `<button type="button" class="btn btn-ghost btn-sm ${t === k ? 'on' : ''}" role="tab" aria-selected="${t === k}" data-act="dev-tab" data-tab="${k}">${l}</button>`).join('')}</div>
      ${t === 'data' ? `
        <p class="help">Edit repositories, checks, interview questions, skill rules and collaborators. Apply to use the new data; it is saved in this browser. Repository keys are <span class="mono">owner/name</span>; any URL containing a word from <span class="mono">rules.private_keywords</span> returns a not-found error.</p>
        <textarea id="devJson" class="code" spellcheck="false" aria-label="Mock JSON">${esc(JSON.stringify(MOCK, null, 2))}</textarea>
        <div id="devJsonErr"></div>` : ''}
      ${t === 'settings' ? `
        <div class="field"><label>Data source</label><div class="seg">
          <button type="button" class="chip ${SETTINGS.mode === 'mock' ? 'on' : ''}" data-act="dev-mode" data-mode="mock">Mock</button>
          <button type="button" class="chip ${SETTINGS.mode === 'live' ? 'on' : ''}" data-act="dev-mode" data-mode="live">Live API</button></div>
          <span class="help">Live API calls the PitchProof backend endpoints at the base URL below.</span></div>
        <div class="field"><label for="devBase">API base URL</label><div class="input" style="height:44px">${ic('link')}<input id="devBase" value="${esc(SETTINGS.baseUrl)}" spellcheck="false"></div></div>
        <div class="field"><label for="devLatency">Mock latency</label><div class="rng"><input id="devLatency" type="range" min="0" max="3000" step="50" value="${SETTINGS.latency}"><output id="devLatencyOut">${SETTINGS.latency} ms</output></div></div>
        <div class="field"><label for="devFail">Mock failure rate</label><div class="rng"><input id="devFail" type="range" min="0" max="100" step="5" value="${SETTINGS.failRate}"><output id="devFailOut">${SETTINGS.failRate}%</output></div><span class="help">Each mock request fails with HTTP 503 at this rate, so you can check error states.</span></div>
        <div>${btn('Clear session and start over', { kind: 'danger', act: 'dev-session', icon: 'refresh', size: 'btn-sm' })}</div>` : ''}
      ${t === 'state' ? `<p class="help">Read-only view of the current client state.</p><pre class="code" id="devState"></pre>` : ''}
    </div>
    ${t === 'data' ? `<div class="drawer-f">${btn('Apply', { act: 'dev-apply', icon: 'check' })}${btn('Copy JSON', { kind: 'secondary', act: 'dev-copy', icon: 'copy' })}<span style="flex:1"></span>${btn('Reset to default', { kind: 'ghost', act: 'dev-reset', icon: 'refresh' })}</div>` : ''}
  </aside>`;
  if (t === 'state') renderDevState();
  $('.drawer [data-act="dev-close"]')?.focus();
}
function renderDevState() {
  const el = $('#devState'); if (!el) return;
  const { toasts, dev, devTab, ...rest } = S;
  el.textContent = JSON.stringify({ settings: SETTINGS, state: rest }, null, 2);
}
function applyMock() {
  const ta = $('#devJson'), box = $('#devJsonErr');
  let data;
  try { data = JSON.parse(ta.value); }
  catch (e) { box.innerHTML = `<div class="alert error">${ic('alert')}<div class="grow"><p>Invalid JSON: ${esc(e.message)}</p></div></div>`; return; }
  const missing = ['repos', 'checks', 'interview', 'skills', 'collaborators', 'rules'].filter(k => !(k in data));
  if (missing.length) { box.innerHTML = `<div class="alert error">${ic('alert')}<div class="grow"><p>Missing top-level keys: ${missing.map(esc).join(', ')}.</p></div></div>`; return; }
  MOCK = data; ls.set('mosa.mock.v2', MOCK); box.innerHTML = '';
  Object.assign(S, { report: null, skills: null, collaborators: null });
  render(); toast('success', 'Mock data applied.');
  if (S.route === 'proof' || S.route === 'match') onEnter(S.route);
}
function resetMock() { MOCK = clone(DEFAULT_MOCK); ls.del('mosa.mock.v2'); renderDev(); render(); toast('success', 'Mock data reset to default.'); }
function copyMock() {
  const ta = $('#devJson');
  navigator.clipboard?.writeText(ta.value).then(() => toast('success', 'JSON copied.'), () => { ta.select(); toast('info', 'Press Ctrl + C to copy the selected JSON.'); }) ?? (ta.select(), toast('info', 'Press Ctrl + C to copy the selected JSON.'));
}

const start = (location.hash || '').slice(1);
render();
if (ROUTES.some(r => r.id === start) && start !== 'home') go(start);
})();
</script>
