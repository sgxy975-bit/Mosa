<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --p-white:#ffffff;
  --p-slate-50:#f5f7f8;--p-slate-100:#eef1f3;--p-slate-200:#e4e8ec;--p-slate-300:#d7dde3;--p-slate-500:#808b98;--p-slate-700:#46515e;--p-slate-950:#121820;
  --p-night-950:#0f1318;--p-night-900:#171c23;--p-night-850:#1c222a;--p-night-800:#232a33;--p-night-700:#2a323c;--p-night-500:#6e7987;--p-night-300:#a8b2be;--p-night-50:#e7ebef;
  --p-cobalt-100:#e2e8fc;--p-cobalt-200:#97aaff;--p-cobalt-300:#7d95ff;--p-cobalt-600:#2445c9;--p-cobalt-700:#1b37a6;--p-cobalt-900:#1f2850;--p-cobalt-950:#0b1030;
  --p-brass-100:#f6e9d1;--p-brass-300:#e2a64a;--p-brass-600:#a86a12;--p-brass-900:#3b2c14;
  --p-green-100:#dcf0e6;--p-green-400:#47c391;--p-green-700:#147a52;--p-green-900:#15342a;
  --p-amber-100:#f8ead2;--p-amber-400:#e9ad48;--p-amber-700:#a6680b;--p-amber-900:#3a2c13;
  --p-red-100:#f8dedb;--p-red-400:#f07a6e;--p-red-600:#bf3328;--p-red-900:#41201d;
  --p-mosa-navy:#1c2b57;--p-mosa-olive:#7d8a50;--p-mosa-steel:#86a0b8;
  --p-shadow-light:0 1px 2px rgb(18 24 32 / .06),0 8px 24px -12px rgb(18 24 32 / .18);
  --p-shadow-dark:0 1px 2px rgb(0 0 0 / .4),0 10px 28px -14px rgb(0 0 0 / .6);

  --bg:var(--p-slate-100);--surface:var(--p-white);--surface-2:var(--p-slate-50);--sunk:var(--p-slate-200);
  --ink:var(--p-slate-950);--ink-2:var(--p-slate-700);--ink-3:var(--p-slate-500);--line:var(--p-slate-300);
  --accent:var(--p-cobalt-600);--accent-hover:var(--p-cobalt-700);--accent-ink:var(--p-white);--accent-soft:var(--p-cobalt-100);
  --seal:var(--p-brass-600);--seal-soft:var(--p-brass-100);
  --ok:var(--p-green-700);--ok-soft:var(--p-green-100);--warn:var(--p-amber-700);--warn-soft:var(--p-amber-100);--bad:var(--p-red-600);--bad-soft:var(--p-red-100);
  --shadow:var(--p-shadow-light);
  --brand-fg:var(--p-mosa-navy);
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--tap:44px;

  --btn-primary-bg:var(--accent);--btn-primary-bg-hover:var(--accent-hover);--btn-primary-fg:var(--accent-ink);
  --card-bg:var(--surface);--card-border:var(--line);
  --qcard-bg:var(--ink);--qcard-fg:var(--bg);--qcard-progress:var(--seal);
  --option-bg:var(--surface);--option-border:var(--line);--option-hover-border:var(--ink-3);--option-selected-bg:var(--accent-soft);--option-selected-border:var(--accent);
  --guide-bg:var(--seal-soft);--guide-icon:var(--seal);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--p-night-950);--surface:var(--p-night-900);--surface-2:var(--p-night-850);--sunk:var(--p-night-800);
  --ink:var(--p-night-50);--ink-2:var(--p-night-300);--ink-3:var(--p-night-500);--line:var(--p-night-700);
  --accent:var(--p-cobalt-300);--accent-hover:var(--p-cobalt-200);--accent-ink:var(--p-cobalt-950);--accent-soft:var(--p-cobalt-900);
  --seal:var(--p-brass-300);--seal-soft:var(--p-brass-900);
  --ok:var(--p-green-400);--ok-soft:var(--p-green-900);--warn:var(--p-amber-400);--warn-soft:var(--p-amber-900);--bad:var(--p-red-400);--bad-soft:var(--p-red-900);
  --shadow:var(--p-shadow-dark);--brand-fg:var(--p-night-50);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--p-night-950);--surface:var(--p-night-900);--surface-2:var(--p-night-850);--sunk:var(--p-night-800);
  --ink:var(--p-night-50);--ink-2:var(--p-night-300);--ink-3:var(--p-night-500);--line:var(--p-night-700);
  --accent:var(--p-cobalt-300);--accent-hover:var(--p-cobalt-200);--accent-ink:var(--p-cobalt-950);--accent-soft:var(--p-cobalt-900);
  --seal:var(--p-brass-300);--seal-soft:var(--p-brass-900);
  --ok:var(--p-green-400);--ok-soft:var(--p-green-900);--warn:var(--p-amber-400);--warn-soft:var(--p-amber-900);--bad:var(--p-red-400);--bad-soft:var(--p-red-900);
  --shadow:var(--p-shadow-dark);--brand-fg:var(--p-night-50);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.2vw,46px);line-height:1.05;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;min-height:var(--tap);text-decoration:none;color:var(--ink);white-space:nowrap;background:none;border:0;cursor:pointer;padding:0 4px 0 0;border-radius:10px}
.brand-mark{width:40px;height:40px;flex:none;display:block;object-fit:contain;background:transparent}
.brand-word{font:800 22px/1 var(--f-display);letter-spacing:-.025em;color:var(--brand-fg)}
.steps{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-size:14px}
.step b{font:500 11px/1 var(--f-mono);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);color:var(--ink-3)}
.step:hover{background:var(--surface-2)}
.step.on{color:var(--ink);font-weight:600}
.step.on b{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step.done b{border-color:var(--ok);color:var(--ok)}
.step.locked{color:var(--ink-3)}
.step svg{width:13px;height:13px}
.top-tools{display:flex;gap:8px;align-items:center}
.mode{font:500 11px/1 var(--f-mono);padding:6px 8px;border-radius:6px;background:var(--sunk);color:var(--ink-2);letter-spacing:.04em}
.mode.live{background:var(--ok-soft);color:var(--ok)}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 72px}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head > div:not(.tabs){display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.step span{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel.raised{box-shadow:var(--shadow);border-color:transparent}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--btn-primary-bg);color:var(--btn-primary-fg)}
.btn-primary:hover:not(:disabled){background:var(--btn-primary-bg-hover)}
.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-secondary:hover:not(:disabled){border-color:var(--ink-3)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-lg{height:52px;padding:0 24px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-busy="true"]{opacity:.85;cursor:progress}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13.5px}
.input{display:flex;align-items:center;gap:10px;height:52px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;transition:border-color .15s}
.input:focus-within{border-color:var(--accent)}
.input.err{border-color:var(--bad)}
.input svg{width:20px;height:20px;color:var(--ink-3);flex:none}
.input input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%;font-size:15.5px}
textarea.ta{width:100%;min-height:170px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;outline:0;line-height:1.6}
textarea.ta:focus{border-color:var(--accent)}
.help{font-size:13px;color:var(--ink-3)}
.errtext{font-size:13px;color:var(--bad)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;font-size:14px}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert.error{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--ink)}
.alert .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.alert .grow p{color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.tag.hl{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tag.seal{background:var(--seal-soft);border-color:transparent;color:var(--seal);font-weight:600}
.tag svg{width:13px;height:13px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.idle{background:var(--sunk);color:var(--ink-2)}
.pill.run{background:var(--accent-soft);color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat b{font:700 22px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
@media (max-width:760px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}}
.langbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.langbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.check{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.check:last-child{border-bottom:0}
.check .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.check .ic svg{width:15px;height:15px}
.check .ic.ok{background:var(--ok-soft);color:var(--ok)}
.check .ic.warn{background:var(--warn-soft);color:var(--warn)}
.check .ic.bad{background:var(--bad-soft);color:var(--bad)}
.check .ic.idle{background:var(--sunk);color:var(--ink-3)}
.check .t{font-weight:600;font-size:14px}
.check .d{font-size:13px;color:var(--ink-2)}
.check .w{font:500 12px var(--f-mono);color:var(--ink-3)}
.check.pending{opacity:.55}

.score{display:flex;align-items:center;gap:20px}
.ring{--v:0;--c:var(--accent);width:120px;height:120px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring::before{content:"";grid-area:1/1;width:94px;height:94px;border-radius:50%;background:var(--surface)}
.ring b{grid-area:1/1;z-index:1;font:800 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ring.sm{width:84px;height:84px}
.ring.sm::before{width:64px;height:64px}
.ring.sm b{font-size:22px}

.qcard{border-radius:var(--r);background:var(--qcard-bg);color:var(--qcard-fg);padding:26px 28px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qhead-l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font:700 22px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.qnum span{color:color-mix(in srgb,var(--qcard-fg) 50%,transparent);font-weight:500}
.qtype{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--qcard-fg) 12%,transparent);color:var(--qcard-fg)}
.qtype svg{width:13px;height:13px}
.qtext{font:700 22px/1.4 var(--f-display);text-wrap:pretty;margin:0}
.qcard .eyebrow{color:color-mix(in srgb,var(--qcard-fg) 60%,transparent)}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--qcard-fg) 22%,transparent)}
.dots i.on{background:var(--qcard-progress)}
.dims{display:flex;flex-direction:column;gap:12px}
.dim{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13.5px}
.dim .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.dim .bar i{display:block;height:100%;background:var(--accent)}
.dim b{font:500 13px var(--f-mono);text-align:right}
.answer{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.answer .q{font-weight:600;font-size:14px}
.answer .a{font-size:14px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--guide-bg);color:var(--ink)}
.options{display:flex;flex-direction:column;gap:10px;border:0;margin:0;padding:0;min-width:0}
.options legend{font-weight:600;font-size:13.5px;padding:0;margin-bottom:6px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr) 22px;align-items:center;gap:12px;min-height:var(--tap);padding:12px 14px;border:1.5px solid var(--option-border);border-radius:10px;background:var(--option-bg);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--option-hover-border)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .key{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:600 13px var(--f-mono);background:var(--sunk);color:var(--ink-2)}
.opt .txt{font-size:15px;line-height:1.45}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);justify-self:end;position:relative}
.opt:has(input:checked){border-color:var(--option-selected-border);background:var(--option-selected-bg)}
.opt:has(input:checked) .key{background:var(--accent);color:var(--accent-ink)}
.opt:has(input:checked) .radio{border-color:var(--accent)}
.opt:has(input:checked) .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){cursor:progress;opacity:.7}
.guide{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:10px;background:var(--guide-bg)}
.guide-h{display:flex;align-items:center;gap:8px;font:700 14px var(--f-display)}
.guide-h svg{width:18px;height:18px;color:var(--guide-icon)}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink)}
.choice-res{display:flex;flex-direction:column;gap:6px}
.choice-res .line{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.choice-res .line svg{width:16px;height:16px;flex:none;margin-top:3px}
.tip svg{width:16px;height:16px;color:var(--guide-icon);flex:none;margin-top:2px}
.minis{display:flex;flex-wrap:wrap;gap:6px}

.tabs{display:inline-flex;padding:4px;border-radius:11px;background:var(--sunk);gap:4px}
.tabs .btn{height:38px}
.tabs .btn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

let MOCK = ls.get('mosa.mock.v2') || clone(DEFAULT_MOCK);
let SETTINGS = { ...DEFAULT_SETTINGS, ...(ls.get('mosa.settings') || {}) };

class ApiError extends Error {
  constructor(message, status = 0, code = 'error') { super(message); this.status = status; this.code = code; }
}

const parseRepoUrl = raw => {
  const s = String(raw || '').trim().replace(/\.git$/, '').replace(/\/+$/, '');
  const m = s.match(/^(?:https?:\/\/)?(?:www\.)?github\.com\/([A-Za-z0-9-]{1,39})\/([A-Za-z0-9._-]{1,100})$/i);
  return m ? { owner: m[1], name: m[2], key: `${m[1]}/${m[2]}`.toLowerCase(), url: `https://github.com/${m[1]}/${m[2]}` } : null;
};
const titleCase = s => s.replace(/[-_.]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

const DB = { projects: {}, tasks: {}, sessions: {}, matching: { joined: false, since: null } };

const Mock = {
  repoFor(parsed) {
    const found = Object.entries(MOCK.repos || {}).find(([k]) => k.toLowerCase() === parsed.key);
    if (found) return clone(found[1]);
    const r = seeded(hash(parsed.key));
    const langs = ['TypeScript','Python','JavaScript','Go','CSS','Swift'];
    const a = langs[Math.floor(r()*langs.length)], b = langs.filter(l => l !== a)[Math.floor(r()*5)];
    const share = 50 + Math.floor(r()*40);
    const commits = 5 + Math.floor(r()*120);
    return {
      title: titleCase(parsed.name), description: `Student project ${parsed.name.replace(/[-_]/g,' ')}.`, fork: r() < .12,
      stars: Math.floor(r()*40), forks: Math.floor(r()*8), commits, active_days: Math.max(1, Math.floor(commits / (2 + r()*4))),
      contributors: 1 + Math.floor(r()*4), readme_chars: Math.floor(r()*3000), claim_match: r() < .7 ? 'pass' : 'warn',
      demo_url: r() < .6 ? `https://${parsed.name.toLowerCase()}.example.app` : '', demo_up: r() < .8,
      created_at: '2026-04-10', last_push: '2026-10-' + String(1 + Math.floor(r()*20)).padStart(2,'0'),
      languages: { [a]: share, [b]: 100 - share }
    };
  },
  evaluate(repo) {
    const days = repo.active_days || 0;
    const recent = (Date.now() - new Date(repo.last_push).getTime()) / 864e5 <= 90;
    const status = {
      repo_exists: ['pass', 'Public repository found'],
      original_work: repo.fork ? ['warn', 'Forked from another repository'] : ['pass', 'Original repository, not a fork'],
      history_depth: [repo.commits >= 30 ? 'pass' : repo.commits >= 10 ? 'warn' : 'fail', `${repo.commits} commits`],
      history_spread: [days >= 7 && recent ? 'pass' : days >= 3 ? 'warn' : 'fail', `Commits on ${days} different days${recent ? '' : ', no activity in the last 90 days'}`],
      team_match: [repo.contributors >= 2 ? 'pass' : 'warn', `${repo.contributors} contributor${repo.contributors === 1 ? '' : 's'}`],
      readme: [repo.readme_chars >= 800 ? 'pass' : repo.readme_chars >= 200 ? 'warn' : 'fail', `README is ${repo.readme_chars.toLocaleString('en-GB')} characters`],
      claim_match: [repo.claim_match || 'pass', repo.claim_match === 'pass' ? 'Description keywords appear in the code and README' : 'Only some description keywords appear in the repository'],
      demo_live: !repo.demo_url ? ['warn', 'No demo link provided'] : repo.demo_up ? ['pass', 'Demo responds (HTTP 200)'] : ['fail', 'Demo link did not respond'],
    };
    return (MOCK.checks || []).map(c => {
      const [s, d] = status[c.id] || ['skip', 'No rule for this check'];
      return { id: c.id, label: c.label, weight: c.weight, status: s, detail: d, hint: s === 'pass' ? null : c.hint };
    });
  },
  score(checks) {
    const f = { pass: 1, warn: .5, fail: 0 };
    const counted = checks.filter(c => c.status in f);
    const total = counted.reduce((a, c) => a + c.weight, 0);
    const s = total ? Math.round(100 * counted.reduce((a, c) => a + c.weight * f[c.status], 0) / total) : 0;
    const R = MOCK.rules || {};
    return { score: s, verdict: s >= (R.verified_threshold ?? 70) ? 'verified' : s >= (R.partial_threshold ?? 40) ? 'partial' : 'unverified' };
  },
  async submitProject({ url }) {
    const p = parseRepoUrl(url);
    if (!p) throw new ApiError('Enter a GitHub repository URL like https://github.com/owner/repository.', 422, 'invalid_url');
    if ((MOCK.rules?.private_keywords || []).some(k => p.key.includes(k))) throw new ApiError(`We couldn't find ${p.owner}/${p.name}. Check the spelling, or make the repository public and try again.`, 404, 'not_found');
    const repo = this.repoFor(p);
    const id = 'prj_' + hash(p.key).toString(36);
    DB.projects[id] = { id, url: p.url, owner: p.owner, name: p.name, ...repo, status: 'submitted', submitted_at: new Date().toISOString() };
    return clone(DB.projects[id]);
  },
  async startVerification(pid) {
    const proj = DB.projects[pid];
    if (!proj) throw new ApiError('This project no longer exists. Submit it again.', 404);
    const id = 'tsk_' + Date.now().toString(36);
    proj.status = 'verifying';
    DB.tasks[id] = { id, pid, started: Date.now(), duration: MOCK.rules?.verify_duration_ms ?? 4200, checks: this.evaluate(proj) };
    return { id, status: 'running', progress: 0, step: 'Queued' };
  },
  async getTask(tid) {
    const t = DB.tasks[tid];
    if (!t) throw new ApiError('Verification task not found.', 404);
    const progress = Math.min(100, Math.round((Date.now() - t.started) / t.duration * 100));
    const shown = Math.floor(progress / 100 * t.checks.length);
    const steps = ['Fetching repository', 'Reading commit history', 'Checking contributors', 'Reading README', 'Comparing description with code', 'Probing demo link', 'Scoring'];
    if (progress < 100) return { id: tid, status: 'running', progress, step: steps[Math.min(steps.length - 1, Math.floor(progress / 100 * steps.length))], checks: t.checks.slice(0, shown) };
    const res = this.score(t.checks);
    const proj = DB.projects[t.pid];
    Object.assign(proj, { status: res.verdict, trust: res.score, checks: t.checks, verified_at: new Date().toISOString() });
    return { id: tid, status: 'done', progress: 100, step: 'Done', checks: t.checks, result: res };
  },
  async startInterview(pid) {
    const proj = DB.projects[pid];
    if (!proj?.checks) throw new ApiError('Verify the project before starting the interview.', 409);
    const n = MOCK.rules?.questions_per_session ?? 5;
    const fill = t => String(t).replaceAll('{title}', proj.title);
    const bank = (MOCK.interview?.questions || []).map(fill);
    const gaps = proj.checks.filter(c => c.hint).map(c => c.hint).slice(0, 2);
    const texts = [...new Set([bank[0], ...gaps, ...bank.slice(1)].filter(Boolean))];
    const choices = shuffle((MOCK.interview?.choice || DEFAULT_MOCK.interview.choice).filter(c => c?.options?.length >= 2));
    let types = Array.from({ length: n }, () => Math.random() < .5 ? 'text' : 'choice');
    if (n > 1 && !types.includes('text')) types[Math.floor(Math.random() * n)] = 'text';
    if (n > 1 && !types.includes('choice')) types[Math.floor(Math.random() * n)] = 'choice';
    let ti = 0, ci = 0;
    const plan = types.map(t => {
      if (t === 'choice' && ci < choices.length) {
        const c = choices[ci++];
        const opts = shuffle(c.options.map((o, k) => ({ id: 'o' + k, text: fill(o.text), score: o.score })));
        return { type: 'choice', text: fill(c.question), options: opts.map(({ id, text }) => ({ id, text })), _opts: opts, why: c.why || '' };
      }
      return ti < texts.length ? { type: 'text', text: texts[ti++] } : null;
    }).filter(Boolean);
    if (!plan.length) throw new ApiError('The mock data has no interview questions. Add some under interview.questions or interview.choice.', 500);
    const id = 'ses_' + Date.now().toString(36);
    DB.sessions[id] = { id, pid, plan, answers: [] };
    return { id, total: plan.length, questions: plan.map(publicQ), sequential: false };
  },
  grade(question, text, title) {
    const units = (text.match(/[A-Za-z]+/g) || []).length + (text.match(/[一-鿿]/g) || []).length;
    const depth = units < 15 ? 1 : units < 40 ? 2 : units < 90 ? 3 : units < 160 ? 4 : 5;
    const ev = (text.match(/\d+%?|for example|e\.g\.|such as|we measured|tested|survey|interview|users? (said|told)|data/gi) || []).length;
    const evidence = 1 + Math.min(4, ev);
    const mk = (text.match(/\b(first|second|third|then|because|so that|however|finally|therefore)\b/gi) || []).length;
    const clarity = units < 15 ? 1 : Math.min(5, 2 + mk);
    const qt = new Set((question + ' ' + title).toLowerCase().match(/[a-z]{4,}/g) || []);
    const at = new Set(text.toLowerCase().match(/[a-z]{4,}/g) || []);
    const ov = [...qt].filter(w => at.has(w)).length / Math.max(1, qt.size);
    const relevance = units < 5 ? 1 : Math.min(5, 2 + Math.round(ov * 8));
    const scores = { clarity, evidence, depth, relevance };
    const tips = {
      clarity: 'Lead with your answer, then give two or three supporting points in order.',
      evidence: 'Add one concrete number, test result or user quote to back up your claim.',
      depth: 'Go one level deeper: why this approach, what you rejected, and what it cost.',
      relevance: 'Answer the exact question first, then add context.'
    };
    const weakest = Object.keys(scores).reduce((a, b) => scores[a] <= scores[b] ? a : b);
    const avg = Object.values(scores).reduce((a, b) => a + b, 0) / 4;
    return { scores, score: Math.round(avg * 20), tip: tips[weakest], weakest };
  },
  gradeChoice(q, choiceId) {
    const o = q._opts.find(x => x.id === choiceId);
    if (!o) throw new ApiError('Pick one of the options before submitting.', 422, 'no_choice');
    const best = q._opts.reduce((a, b) => b.score > a.score ? b : a);
    const v = Math.max(1, Math.min(5, o.score));
    const scores = { clarity: Math.min(5, v + 1), evidence: v, depth: v, relevance: v };
    const avg = Object.values(scores).reduce((a, b) => a + b, 0) / 4;
    return { scores, score: Math.round(avg * 20), tip: q.why || 'Compare the options against the risk, cost and evidence each one carries.', weakest: 'depth', choice: { picked: o.id, best: best.id, correct: o.id === best.id } };
  },
  async submitAnswer(sid, payload) {
    const s = DB.sessions[sid];
    if (!s) throw new ApiError('Interview session expired. Start a new interview.', 404);
    const idx = Number.isInteger(payload.index) ? payload.index : s.answers.length;
    if (idx < 0 || idx >= s.plan.length) throw new ApiError('That question does not exist.', 404);
    if (s.answers.some(x => x.index === idx)) throw new ApiError(`Question ${idx + 1} is already answered.`, 409, 'already_answered');
    const q = s.plan[idx];
    let fb;
    if (q.type === 'choice') fb = this.gradeChoice(q, payload.choice);
    else {
      const text = String(payload.text || '');
      const min = MOCK.rules?.min_answer_chars ?? 20;
      if (text.trim().length < min) throw new ApiError(`Write at least ${min} characters so the interviewer has something to assess.`, 422, 'too_short');
      fb = this.grade(q.text, text, DB.projects[s.pid]?.title || '');
    }
    s.answers.push({ index: idx, question: q, answer: payload, feedback: fb });
    const i = s.answers.length;
    const done = i >= s.plan.length;
    if (done) {
      const proj = DB.projects[s.pid];
      proj.interview = { score: Math.round(s.answers.reduce((a, x) => a + x.feedback.score, 0) / i), dims: avgDims(s.answers), at: new Date().toISOString() };
    }
    return { index: idx, feedback: fb, done, answered: i, total: s.plan.length };
  },
  async getReport(pid) {
    const p = DB.projects[pid];
    if (!p?.checks) throw new ApiError('No verification found for this project yet.', 404);
    const iv = p.interview || null;
    return {
      project: { id: p.id, title: p.title, url: p.url },
      trust: p.trust, verdict: p.status, checks: p.checks,
      interview: iv ? iv.score : null, dims: iv ? iv.dims : null,
      readiness: iv ? Math.round(.6 * iv.score + .4 * p.trust) : null,
      generated_at: new Date().toISOString(), report_id: 'rep_' + hash(pid + (iv?.at || '')).toString(36)
    };
  },
  async getSkills(pid) {
    const p = DB.projects[pid];
    if (!p?.checks) throw new ApiError('Verify the project to unlock skills.', 409);
    const langs = p.languages || {};
    const iv = p.interview;
    return (MOCK.skills || []).map(sk => {
      let verified = false, level = 0, evidence = [], reason = '';
      if (sk.type === 'language') {
        const share = langs[sk.language] || 0;
        if (!share) return null;
        verified = p.trust >= (sk.min_trust ?? 60);
        level = Math.max(1, Math.min(5, Math.round(share / 20)));
        evidence = [`${share}% of code in ${p.owner}/${p.name}`, `${p.commits} commits across ${p.active_days} days`];
        reason = verified ? '' : `Needs a trust score of ${sk.min_trust ?? 60} (currently ${p.trust}).`;
      } else if (sk.type === 'check') {
        const c = p.checks.find(x => x.id === sk.check);
        if (!c) return null;
        verified = c.status === 'pass';
        level = c.status === 'pass' ? 4 : c.status === 'warn' ? 2 : 1;
        evidence = [c.detail];
        reason = verified ? '' : `${c.label} check returned ${c.status}.`;
      } else if (sk.type === 'interview') {
        const v = iv?.dims?.[sk.dimension];
        level = v ? Math.round(v) : 0;
        verified = v != null && v >= (sk.min_avg ?? 3);
        evidence = v != null ? [`Interview average ${v.toFixed(1)} / 5 on ${sk.dimension}`] : [];
        reason = v == null ? 'Complete the AI interview to assess this skill.' : verified ? '' : `Needs an average of ${sk.min_avg ?? 3} / 5 (currently ${v.toFixed(1)}).`;
      } else return null;
      return { name: sk.name, category: sk.category, verified, level, evidence, reason };
    }).filter(Boolean);
  },
  async getMatching() { return { joined: DB.matching.joined, visible_to: DB.matching.joined ? (MOCK.collaborators || []).length : 0 }; },
  async setMatching(joined) {
    DB.matching.joined = !!joined; DB.matching.since = joined ? new Date().toISOString() : null;
    return this.getMatching();
  },
  async getCollaborators(verifiedSkills) {
    const mine = new Set(verifiedSkills.map(s => s.toLowerCase()));
    const want = new Set((MOCK.user?.seeking || []).map(s => s.toLowerCase()));
    return (MOCK.collaborators || []).map(c => {
      const brings = c.skills.filter(s => want.has(s.toLowerCase()));
      const needs = c.seeking.filter(s => mine.has(s.toLowerCase()));
      const m = Math.round(50 * brings.length / Math.max(1, want.size) + 50 * needs.length / Math.max(1, c.seeking.length));
      return { ...c, match: m, brings, needs };
    }).sort((a, b) => b.match - a.match);
  },
  async requestIntro(handle) {
    if (!DB.matching.joined) throw new ApiError('Join matching before requesting an introduction.', 409);
    const c = (MOCK.collaborators || []).find(x => x.handle === handle);
    if (!c) throw new ApiError('This student is no longer in matching.', 404);
    return { handle, status: 'requested' };
  }
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function publicQ(q) { return q.type === 'choice' ? { type: 'choice', text: q.text, options: q.options } : { type: 'text', text: q.text }; }
function avgDims(answers) {
  const k = ['clarity', 'evidence', 'depth', 'relevance'], o = {};
  k.forEach(d => o[d] = Math.round(answers.reduce((a, x) => a + x.feedback.scores[d], 0) / answers.length * 10) / 10);
  return o;
}

const Http = {
  async req(method, path, body) {
    let r;
    const base = SETTINGS.baseUrl.replace(/\/+$/, '');
    try {
      r = await fetch(base + path, { method, headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw new ApiError(`Can't reach the API at ${base}. Check the base URL or switch to Mock mode in Mock Data.`, 0, 'network');
    }
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (r.status === 404 && !data?.detail) throw new ApiError(`The server doesn't have ${method} ${path} yet (HTTP 404).`, 404, 'missing_endpoint');
    if (!r.ok) {
      const d = data?.detail;
      throw new ApiError(Array.isArray(d) ? d.map(x => x.msg).join('; ') : (d || `Request failed with HTTP ${r.status}.`), r.status);
    }
    return data;
  },
  normProject(p) {
    const rp = parseRepoUrl(p.repo_url) || { owner: '—', name: p.title, url: p.repo_url };
    return { id: p.id, url: rp.url, owner: rp.owner, name: rp.name, title: p.title, description: p.summary || '', stars: p.stars ?? null, forks: p.forks ?? null, commits: p.commits ?? null, active_days: p.active_days ?? null, contributors: p.contributors ?? null, last_push: p.updated_at, languages: p.languages || {}, status: p.status === 'new' ? 'submitted' : p.status, trust: p.trust_score };
  },
  normChecks(list) {
    const L = Object.fromEntries((MOCK.checks || []).map(c => [c.id, c.label]));
    return (list || []).map(c => ({ id: c.id, label: L[c.id] || c.id, weight: c.weight, status: c.status === 'skip' ? 'skip' : c.status, detail: c.detail, hint: c.interview_hint }));
  },
  async submitProject({ url }) {
    const p = parseRepoUrl(url);
    if (!p) throw new ApiError('Enter a GitHub repository URL like https://github.com/owner/repository.', 422, 'invalid_url');
    return this.normProject(await this.req('POST', '/api/projects', { title: titleCase(p.name), repo_url: p.url, stage: 'mvp' }));
  },
  async startVerification(pid) { const t = await this.req('POST', `/api/projects/${pid}/verify`); this._pid = pid; return { id: t.id, status: 'running', progress: t.progress || 0, step: 'Queued' }; },
  async getTask(tid) {
    const t = await this.req('GET', `/api/tasks/${tid}`);
    if (t.status === 'failed') throw new ApiError((t.error || 'Verification failed.').split('\n')[0], 500, 'task_failed');
    if (t.status !== 'done') return { id: tid, status: 'running', progress: t.progress, step: (t.step || 'Working').replace(/^collect:/, 'Collecting '), checks: [] };
    const p = await this.req('GET', `/api/projects/${t.payload.project_id}`);
    return { id: tid, status: 'done', progress: 100, step: 'Done', checks: this.normChecks(p.verifications?.[0]?.checks), result: { score: t.result.score, verdict: t.result.verdict } };
  },
  async startInterview(pid) {
    const s = await this.req('POST', '/api/interviews', { project_id: pid, persona: 'tech' });
    return { id: s.id, total: s.plan.length, questions: s.plan.map(t => ({ type: 'text', text: t })), sequential: true };
  },
  async submitAnswer(sid, payload) {
    if (payload.expectedIndex != null && payload.index !== payload.expectedIndex) throw new ApiError(`The live API answers questions in order. Answer question ${payload.expectedIndex + 1} first.`, 409, 'sequential');
    const r = await this.req('POST', `/api/interviews/${sid}/answer`, { content: payload.text ?? payload.choiceText ?? '' });
    return { index: payload.index, feedback: r.feedback, done: r.done, answered: r.progress.answered, total: r.progress.total };
  },
  async getReport(pid, sid) {
    const p = await this.req('GET', `/api/projects/${pid}`);
    let iv = null;
    if (sid) {
      const t = await this.req('POST', `/api/interviews/${sid}/finish`);
      for (let i = 0; i < 30; i++) {
        const x = await this.req('GET', `/api/tasks/${t.id}`);
        if (x.status === 'done') { iv = x.result; break; }
        if (x.status === 'failed') throw new ApiError('Report generation failed.', 500);
        await sleep(800);
      }
    }
    return { project: { id: p.id, title: p.title, url: p.repo_url }, trust: p.trust_score, verdict: p.status, checks: this.normChecks(p.verifications?.[0]?.checks), interview: iv?.overall ?? null, dims: iv?.dimensions ?? null, readiness: iv?.readiness ?? null, generated_at: new Date().toISOString(), report_id: 'rep_' + p.id };
  },
  async getSkills(pid) { return this.req('GET', `/api/projects/${pid}/skills`); },
  async getMatching() { return this.req('GET', '/api/matching'); },
  async setMatching(joined) { return this.req('POST', '/api/matching', { joined }); },
  async getCollaborators(skills) { return this.req('GET', '/api/collaborators?skills=' + encodeURIComponent(skills.join(','))); },
  async requestIntro(handle) { return this.req('POST', '/api/collaborators/intro', { handle }); },
};

const api = new Proxy({}, {
  get: (_, name) => async (...args) => {
    if (SETTINGS.mode === 'live') return Http[name](...args);
    const quick = name === 'getTask';
    await sleep(quick ? Math.min(250, SETTINGS.latency) : SETTINGS.latency * (.7 + Math.random() * .6));
    if (Math.random() * 100 < SETTINGS.failRate) throw new ApiError(`Simulated server error on ${name} (HTTP 503). Try again.`, 503, 'simulated');
    return Mock[name](...args);
  }
});

async function run(key, fn) {
  if (S.pending[key]) return;
  S.pending = { ...S.pending, [key]: true }; S.errors = { ...S.errors, [key]: null }; render();
  try { return await fn(); }
  catch (e) { S.errors = { ...S.errors, [key]: e.message || 'Something went wrong.' }; toast('error', e.message || 'Something went wrong.'); }
  finally { S.pending = { ...S.pending, [key]: false }; render(); }
}
let toastId = 0;

  const id = ++toastId;

}
