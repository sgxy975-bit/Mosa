<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Proof of Skill Spec</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a deck of 16:9 slides (1600×900 base, scaled to the column width) stacked vertically.
   Page slides: app mockup in a browser frame on the left with numbered pins, annotation list on the right.
   Pins: green circle = entry, red square = exit, blue leaf = function; a gold ring + K-number marks the 7 key buttons. */
:root{
  --desk:#e6e9ec;--sheet:#ffffff;--sheet-2:#f6f7f9;--ink:#141a22;--ink-2:#4a5562;--ink-3:#87919d;--line:#dde2e7;
  --app-bg:#eef1f3;--app-surface:#ffffff;--app-sunk:#e4e8ec;--accent:#2445c9;--accent-soft:#e2e8fc;--accent-ink:#ffffff;
  --seal:#a86a12;--seal-soft:#f6e9d1;--ok:#147a52;--ok-soft:#dcf0e6;--warn:#a6680b;--warn-soft:#f8ead2;--bad:#bf3328;--bad-soft:#f8dedb;
  --entry:#13906a;--exit:#d9472f;--func:#4a57d6;--key:#d99a1e;
  --f-display:"Schibsted Grotesk","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0d1014;--sheet:#171c23;--sheet-2:#1c222a;--ink:#e7ebef;--ink-2:#a8b2be;--ink-3:#6e7987;--line:#2a323c;
  --app-bg:#0f1318;--app-surface:#171c23;--app-sunk:#232a33;--accent:#7d95ff;--accent-soft:#1f2850;--accent-ink:#0b1030;
  --seal:#e2a64a;--seal-soft:#3b2c14;--ok:#47c391;--ok-soft:#15342a;--warn:#e9ad48;--warn-soft:#3a2c13;--bad:#f07a6e;--bad-soft:#41201d;
  --entry:#3cc497;--exit:#f0705a;--func:#8692f5;--key:#f0b13a;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0d1014;--sheet:#171c23;--sheet-2:#1c222a;--ink:#e7ebef;--ink-2:#a8b2be;--ink-3:#6e7987;--line:#2a323c;
  --app-bg:#0f1318;--app-surface:#171c23;--app-sunk:#232a33;--accent:#7d95ff;--accent-soft:#1f2850;--accent-ink:#0b1030;
  --seal:#e2a64a;--seal-soft:#3b2c14;--ok:#47c391;--ok-soft:#15342a;--warn:#e9ad48;--warn-soft:#3a2c13;--bad:#f07a6e;--bad-soft:#41201d;
  --entry:#3cc497;--exit:#f0705a;--func:#8692f5;--key:#f0b13a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.bar h1{font:800 16px/1 var(--f-display);margin:0;white-space:nowrap}
.bar .sp{flex:1}
.tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:13px;white-space:nowrap}
.tg[aria-pressed="false"]{opacity:.45}
.tg.dark{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tg.dark[aria-pressed="false"]{background:var(--sheet);color:var(--ink);opacity:1}
.tg i{width:11px;height:11px;display:inline-block}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav span{font:500 12px var(--f-mono);color:var(--ink-2);min-width:58px;text-align:center}
.deck{max-width:1400px;margin:24px auto 0;display:flex;flex-direction:column;gap:28px}
.frame{position:relative;width:100%;min-width:0}
.slide{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--sheet);border-radius:10px;box-shadow:0 1px 2px rgb(0 0 0 / .08),0 20px 40px -24px rgb(0 0 0 / .35);overflow:hidden}
.slide.cur{outline:3px solid var(--accent);outline-offset:4px}

.sh{position:absolute;left:48px;right:48px;top:36px;display:flex;align-items:flex-end;gap:20px}
.sh .no{font:600 14px var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.sh h2{font:800 34px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.sh .cn{font:500 18px var(--f-cn);color:var(--ink-2)}
.sh .grow{flex:1;display:flex;flex-direction:column;gap:6px}
.sh .meta{font:500 12px var(--f-mono);color:var(--ink-3);text-align:right;line-height:1.7}
.foot{position:absolute;left:48px;right:48px;bottom:22px;display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--ink-3);letter-spacing:.05em}

.mock{position:absolute;left:48px;top:128px;width:1040px;height:722px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--app-bg);display:flex;flex-direction:column}
.chrome{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--sheet-2);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.chrome .url{margin-left:14px;flex:1;max-width:420px;height:22px;border-radius:6px;background:var(--sheet);border:1px solid var(--line);font:500 11px/20px var(--f-mono);color:var(--ink-3);padding:0 10px}
.ann{position:absolute;left:1112px;right:40px;top:128px;bottom:52px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.ann h3{margin:0;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.arow{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:7px 8px;border-radius:9px;border:1px solid transparent}
.arow.hot{background:var(--sheet-2);border-color:var(--line)}
.arow.off{display:none}
.arow .t{font:700 14px/1.3 var(--f-body);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.arow .t small{font:500 11px var(--f-mono);color:var(--ink-3)}
.arow .d{font:400 12.5px/1.5 var(--f-cn);color:var(--ink-2)}
.arow .m{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.arow code{font:500 10.5px/1.6 var(--f-mono);background:var(--sheet-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-2)}
.arow code.to{color:var(--entry);border-color:color-mix(in srgb,var(--entry) 40%,var(--line))}
.arow code.out{color:var(--exit);border-color:color-mix(in srgb,var(--exit) 40%,var(--line))}
.kb{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;background:var(--key);color:#1b1205;font:700 10.5px var(--f-mono)}

.pin{position:absolute;min-width:24px;height:24px;padding:0 5px;border:2px solid var(--sheet);color:#fff;font:700 11.5px/20px var(--f-mono);text-align:center;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgb(0 0 0 / .3);z-index:5;cursor:default;pointer-events:auto}
.pin.entry{background:var(--entry);border-radius:50%}
.pin.exit{background:var(--exit);border-radius:4px}
.pin.func{background:var(--func);border-radius:7px 12px 7px 12px}
.pin.key{box-shadow:0 0 0 3px var(--key),0 1px 3px rgb(0 0 0 / .3)}
.pin.hot{transform:translate(-50%,-50%) scale(1.25)}
.arow .pin{position:static;transform:none;display:inline-block;margin-top:1px}
.pins{position:absolute;inset:0;pointer-events:none}
.annoff .pins,.annoff [data-pin]{outline:none!important}
.annoff .pins{display:none}
[data-pin]{outline:2px dashed transparent;outline-offset:3px}
.slide:not(.annoff) [data-pin].t-entry{outline-color:color-mix(in srgb,var(--entry) 70%,transparent)}
.slide:not(.annoff) [data-pin].t-exit{outline-color:color-mix(in srgb,var(--exit) 70%,transparent)}
.slide:not(.annoff) [data-pin].t-func{outline-color:color-mix(in srgb,var(--func) 55%,transparent)}
.hide-entry [data-pin].t-entry,.hide-exit [data-pin].t-exit,.hide-func [data-pin].t-func{outline-color:transparent!important}
[data-pin].flash{outline-style:solid!important;outline-color:var(--ink)!important}

.app{flex:1;display:flex;flex-direction:column;min-height:0;font-size:12px;color:var(--ink)}
.atop{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--app-surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:7px;font:800 13px var(--f-display);white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--seal)}
.steps{display:flex;gap:2px;flex:1}
.st{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;color:var(--ink-2);font-size:11.5px;white-space:nowrap}
.st b{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);font:600 9px/14px var(--f-mono);text-align:center;color:var(--ink-3)}
.st.on{color:var(--ink);font-weight:600}.st.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.done b{border-color:var(--ok);color:var(--ok)}
.st.lock{color:var(--ink-3)}
.st svg{width:10px;height:10px}
.mode{font:600 9px var(--f-mono);padding:4px 6px;border-radius:5px;background:var(--app-sunk);color:var(--ink-2)}
.ghost{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:5px 8px;border-radius:6px}
.ghost svg{width:13px;height:13px}
.abody{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:16px;min-height:0}
.eb{font:600 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.h1{font:800 28px/1.05 var(--f-display);letter-spacing:-.01em;margin:0}
.h2{font:800 22px/1.1 var(--f-display);margin:0}
.h3{font:700 14px var(--f-display);margin:0}
.mut{color:var(--ink-2)}
.help{font-size:10.5px;color:var(--ink-3)}
.pnl{background:var(--app-surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pnl.raised{border-color:transparent;box-shadow:0 1px 2px rgb(18 24 32 / .06),0 8px 22px -12px rgb(18 24 32 / .2)}
.g2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:8px;font-weight:600;font-size:11.5px;white-space:nowrap;border:1px solid transparent}
.btn svg{width:13px;height:13px}
.bp{background:var(--accent);color:var(--accent-ink)}
.bs{background:var(--app-surface);border-color:var(--line)}
.bd{background:var(--app-surface);border-color:var(--bad);color:var(--bad)}
.bg{color:var(--ink-2)}
.blg{height:38px;font-size:12.5px;padding:0 16px}
.bdis{opacity:.5}
.input{display:flex;align-items:center;gap:8px;height:38px;border:1.5px solid var(--line);border-radius:8px;background:var(--app-surface);padding:0 10px;color:var(--ink-3)}
.input svg{width:15px;height:15px}
.input span{color:var(--ink);font-size:12px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--app-surface);font-size:10.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 7px;border-radius:5px;background:var(--app-bg);border:1px solid var(--line);font-size:10px;white-space:nowrap}
.tag.hl{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tag.seal{background:var(--seal-soft);border-color:transparent;color:var(--seal);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.run{background:var(--accent-soft);color:var(--accent)}.pill.idle{background:var(--app-sunk);color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl td{padding:5px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{padding:8px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column}
.stats div:last-child{border-right:0}
.stats b{font:700 16px var(--f-display)}
.stats span{font-size:9.5px;color:var(--ink-3)}
.lang{display:flex;height:7px;border-radius:4px;overflow:hidden}
.checks{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ck{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--app-surface)}
.ck:last-child{border-bottom:0}
.ck .ic{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.ck .ic svg{width:11px;height:11px}
.ic.ok{background:var(--ok-soft);color:var(--ok)}.ic.warn{background:var(--warn-soft);color:var(--warn)}.ic.idle{background:var(--app-sunk);color:var(--ink-3)}
.ck .t{font-weight:600;font-size:11px;line-height:1.2}.ck .d{font-size:9.5px;color:var(--ink-2)}
.ck .w{font:500 9.5px var(--f-mono);color:var(--ink-3)}
.ck.pend{opacity:.5}
.ring{--v:0;--c:var(--ok);width:72px;height:72px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--app-sunk) 0);display:grid;place-items:center}
.ring::before{content:"";grid-area:1/1;width:56px;height:56px;border-radius:50%;background:var(--app-surface)}
.ring b{grid-area:1/1;z-index:1;font:800 20px var(--f-display)}
.ring.sm{width:52px;height:52px}.ring.sm::before{width:40px;height:40px}.ring.sm b{font-size:15px}
.statetag{align-self:flex-start;font:600 9px var(--f-mono);letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:var(--ink);color:var(--sheet)}
.prog{height:5px;border-radius:3px;background:var(--app-sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.q{border-radius:10px;background:var(--ink);color:var(--sheet);padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.q p{margin:0;font:600 15px/1.4 var(--f-display)}
.q .eb{color:color-mix(in srgb,var(--sheet) 60%,transparent)}
.dots{display:flex;gap:4px}.dots i{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--sheet) 22%,transparent)}.dots i.on{background:var(--seal)}
.ta{height:96px;border:1.5px solid var(--accent);border-radius:8px;background:var(--app-surface);padding:9px;font-size:11px;color:var(--ink-2);line-height:1.5}
.dim{display:grid;grid-template-columns:62px 1fr 22px;gap:7px;align-items:center;font-size:10.5px}
.dim span:nth-child(2){height:6px;border-radius:3px;background:var(--app-sunk);overflow:hidden}
.dim span:nth-child(2) i{display:block;height:100%;background:var(--accent)}
.dim b{font:500 10px var(--f-mono);text-align:right}
.tip{display:flex;gap:7px;padding:7px 9px;border-radius:7px;background:var(--seal-soft);font-size:10.5px;line-height:1.4}
.tip svg{width:12px;height:12px;color:var(--seal);flex:none;margin-top:1px}
.tabs{display:inline-flex;padding:3px;border-radius:9px;background:var(--app-sunk);gap:3px}
.tabs .btn{height:28px}
.tabs .btn.on{background:var(--app-surface);box-shadow:0 1px 2px rgb(0 0 0 / .1);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--app-surface)}
.kpi small{display:block;font-size:9.5px;color:var(--ink-3)}
.verdict{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:var(--ok-soft);color:var(--ok);font-size:11px}
.verdict svg{width:20px;height:20px}
.verdict span{color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sk{position:relative;border:1px solid color-mix(in srgb,var(--seal) 45%,var(--line));border-radius:9px;background:var(--app-surface);padding:11px;display:flex;flex-direction:column;gap:6px}
.sk.no{border-color:var(--line)}
.sk .stamp{position:absolute;top:8px;right:8px;width:26px;height:26px;color:var(--seal)}
.sk.no .stamp{color:var(--ink-3);opacity:.5}
.lv{display:flex;gap:3px}.lv i{width:14px;height:4px;border-radius:2px;background:var(--app-sunk)}.lv i.on{background:var(--seal)}
.sk.no .lv i.on{background:var(--ink-3)}
.ms{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok-soft) 50%,var(--app-surface))}
.ms .bc{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.per{border:1px solid var(--line);border-radius:10px;background:var(--app-surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:8px;color:#fff;font:700 11px/30px var(--f-display);text-align:center;flex:none}
.mt{margin-left:auto;font:800 16px var(--f-display);text-align:right}
.mt small{display:block;font:500 8px var(--f-mono);color:var(--ink-3)}
.kv{display:flex;flex-direction:column;gap:3px}.kv>span{font-size:9px;color:var(--ink-3)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toast{position:absolute;right:16px;bottom:16px;display:flex;gap:7px;align-items:center;padding:8px 11px;border-radius:8px;background:var(--ink);color:var(--sheet);font-size:11px}
.toast svg{width:13px;height:13px;color:var(--ok)}
.alert{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:10.5px}
.alert svg{width:13px;height:13px;flex:none;margin-top:1px}
.alert span{color:var(--ink)}

.cover-l{position:absolute;left:96px;top:120px;width:760px;display:flex;flex-direction:column;gap:24px}
.cover-l .k{font:600 14px var(--f-mono);letter-spacing:.12em;color:var(--ink-3)}
.cover-l h2{font:800 92px/.95 var(--f-display);margin:0;letter-spacing:-.025em}
.cover-l h2 em{font-style:normal;color:var(--seal)}
.cover-l p{font:400 20px/1.55 var(--f-body);color:var(--ink-2);margin:0;max-width:40ch}
.cover-l p.cn{font:400 17px/1.6 var(--f-cn)}
.cover-r{position:absolute;right:96px;top:120px;width:560px;display:flex;flex-direction:column;gap:18px}
.idx{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.idx div{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.idx b{font:600 13px var(--f-mono);color:var(--ink-3)}
.idx span:last-child{font:400 13px var(--f-cn);color:var(--ink-3)}
.keybox{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--sheet-2)}
.keybox div{display:flex;align-items:center;gap:10px;font-size:14px}
.keybox .pin{position:static;transform:none;display:inline-block;flex:none}
.keybox small{font:400 12.5px var(--f-cn);color:var(--ink-3)}

.flowsvg{position:absolute;left:48px;top:150px;width:1504px;height:560px}
.flowsvg text{font-family:var(--f-body);fill:var(--ink)}
.flowsvg .lbl{font:600 13px var(--f-mono)}
.flowsvg .cn{font:400 13px var(--f-cn);fill:var(--ink-2)}
.guards{position:absolute;left:48px;right:48px;bottom:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.guards > div{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--sheet-2);display:flex;flex-direction:column;gap:6px}
.guards h4{margin:0;font:700 15px var(--f-display)}
.guards p{margin:0;font:400 13px/1.55 var(--f-cn);color:var(--ink-2)}
.guards code{font:500 11.5px var(--f-mono);color:var(--ink)}

.matrix{position:absolute;left:48px;right:48px;top:132px;border-collapse:collapse;font-size:13px}
.matrix th{text-align:left;font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;padding:0 12px 10px 0;border-bottom:2px solid var(--ink)}
.matrix td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.matrix td:first-child{white-space:nowrap}
.matrix .bn{font:700 14px var(--f-body);display:block;margin-top:4px}
.matrix .cn{font:400 12.5px var(--f-cn);color:var(--ink-2)}
.matrix code{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.matrix .ld{color:var(--accent)}.matrix .ok{color:var(--ok)}.matrix .er{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      <div class="pnl" style="padding:12px;gap:9px" ${P('5')}><div class="row" style="justify-content:space-between"><b class="h3">Running scores</b><span class="eb">Avg / 5</span></div>
        ${[['Clarity',5],['Evidence',5],['Depth',2],['Relevance',3.5]].map(([k, v]) => `<div class="dim"><span>${k}</span><span><i style="width:${v / 5 * 100}%"></i></span><b>${v.toFixed(1)}</b></div>`).join('')}</div>
      <div class="pnl raised" style="padding:12px;gap:9px"><span class="statetag">STATE · AFTER QUESTION 5</span>
        <div class="row" style="gap:10px"><div class="ring sm" style="--v:76"><b>76</b></div><div><span class="eb">Interview complete</span><div class="h3">You answered all 5 questions</div></div></div>
        <span class="btn bp" ${P('7')}>${ic('report')}View Verification Report</span>
        <span class="btn bs" ${P('8')}>${ic('seal')}View Verified Skills</span></div>
    </div></div></div>`),

P4: () => browser('proof', topbar(3, 3) + `<div class="abody" style="gap:12px">
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:4px"><span class="eb">Step 4 · Verification & skills</span><h2 class="h2">Club Check-in</h2></div>
    <div class="tabs"><span class="btn on" ${P('1')}>${ic('report')}View Verification Report</span><span class="btn bg" ${P('2')}>${ic('seal')}View Verified Skills</span></div></div>
  <div class="kpis" ${P('3')}>${[['Trust score',100,'From repository evidence','var(--ok)'],['Interview',76,'Average across answers','var(--ok)'],['Readiness',86,'60% interview + 40% trust','var(--ok)']].map(([l, v, n, c]) => `<div class="kpi"><div class="ring sm" style="--v:${v};--c:${c}"><b>${v}</b></div><div><span class="eb">${l}</span><small>${n}</small></div></div>`).join('')}</div>
  <div class="verdict" ${P('4')}>${ic('seal')}<div><b>Verified project</b><br><span>The repository history supports the project description.</span></div></div>
  <div class="row" style="justify-content:space-between"><div><b class="h3">7 verified skills</b><div class="help">Skills tab · each skill links to the evidence behind it</div></div><span class="btn bp blg" ${P('6')}>${ic('users')}Find Collaborators</span></div>
  <div class="skills" ${P('5')}>${[['Language','TypeScript',3,'58% of code in octo-club/club-checkin',1],['Engineering practice','Git workflow',4,'Commits on 23 different days',1],['Communication','Technical communication',5,'Interview average 5.0 / 5 on clarity',1],['Language','Rust',1,'Needs a trust score of 60',0]].map(([c, n, l, e, v]) => `<div class="sk ${v ? '' : 'no'}">${stamp}<span class="eb">${c}</span><b class="h3" style="padding-right:30px;font-size:12.5px">${n}</b><div class="lv">${[1,2,3,4,5].map(i => `<i class="${i <= l ? 'on' : ''}"></i>`).join('')}</div><span class="help">${e}</span>${v ? '<span class="tag seal">✓ Verified</span>' : '<span class="tag">Not verified yet</span>'}</div>`).join('')}</div>
  </div>`),

P5: () => browser('match', topbar(4, 4) + `<div class="abody" style="gap:12px">
  <div style="display:flex;flex-direction:column;gap:4px"><span class="eb">Step 5 · Find collaborators</span><h2 class="h2">Students who complement your skills</h2><span class="help">Ranked by what they bring that you are looking for (UI Design, User Research, Backend) and what they need that you have verified.</span></div>
  <div class="ms" ${P('2')}><span class="bc"></span><div style="flex:1"><b style="font-size:12px">You are in matching</b><div class="help">Your verified skills are visible to 6 students. You can request introductions.</div></div><span class="btn bd" ${P('3')}>${ic('logout')}Leave Matching</span></div>
  <div class="row" ${P('4')}>${['All','Backend','Data Analysis','Figma','Product Strategy','Python','UI Design','User Research'].map((f, i) => `<span class="chip ${i ? '' : 'on'}">${f}</span>`).join('')}</div>
  <div class="people">${[
    ['Mei Lin','Product Management Society',67,18,[['User Research',1],['Product Strategy',0]],[['TypeScript',1],['Shipping to users',1]],'Second-hand textbook exchange','Flexible',0],
    ['Sam Patel','Data Science Society',67,95,[['Python',0],['Data Analysis',0],['Backend',1]],[['Team collaboration',1],['TypeScript',1]],'Library seat availability','Flexible',1],
    ['Priya Shah','Leeds Design Society',58,262,[['UI Design',1],['Figma',0],['User Research',1]],[['TypeScript',1],['Backend',0]],'Accessible timetable app','Weekends',2]
  ].map(([n, c, m, h, b, s, pr, av, k]) => `<div class="per"><div class="ph"><span class="av" style="background:hsl(${h} 55% 45%)">${n.split(' ').map(w => w[0]).join('')}</span><div><b style="font-size:11.5px">${n}</b><div class="help">${c}</div></div><div class="mt" style="color:var(--ok)" ${k === 0 ? P('5') : ''}>${m}%<small>MATCH</small></div></div>
    <div class="kv" ${k === 1 ? P('6') : ''}><span>Brings</span><div class="row" style="gap:4px">${b.map(([x, hl]) => `<span class="tag ${hl ? 'hl' : ''}">${x}</span>`).join('')}</div></div>
    <div class="kv"><span>Looking for</span><div class="row" style="gap:4px">${s.map(([x, hl]) => `<span class="tag ${hl ? 'seal' : ''}">${hl ? '✓ ' : ''}${x}</span>`).join('')}</div></div>
    <div class="kv"><span>Working on</span><div style="font-size:10.5px">${pr} <span class="help">· ${av}</span></div></div>
    <div>${k === 0 ? `<span class="btn bs bdis">${ic('check')}Introduction requested</span>` : `<span class="btn bs" ${k === 2 ? P('7') : ''}>${ic('send')}Request intro</span>`}</div></div>`).join('')}</div>
  <div class="toast">${ic('check')}Introduction requested.</div>
  </div>`),
};

const annList = (page) => {
  const rows = A[page];
  return `<h3>Annotations · ${rows.length}</h3>` + rows.map(r => `<div class="arow" data-id="${r.id}" data-t="${r.t}">
    <span class="pin ${r.t} ${r.key ? 'key' : ''}">${r.id}</span>
    <div><div class="t">${r.key ? `<span class="kb">${r.key}</span>` : ''}${r.n}<small>${r.t === 'entry' ? 'ENTRY 入口' : r.t === 'exit' ? 'EXIT 出口' : 'FUNCTION 功能键'}</small></div>
    <div class="d">${r.cn}</div>
    ${(r.to || r.out || r.api || r.meta) ? `<div class="m">${r.to ? `<code class="to">→ ${r.to}</code>` : ''}${r.out ? `<code class="out">↗ ${r.out}</code>` : ''}${r.api ? `<code>${r.api}</code>` : ''}${(r.meta || []).map(x => `<code>${x}</code>`).join('')}</div>` : ''}</div></div>`).join('');
};

const TOTAL = 8;
const head = (n, en, cn, meta='') => `<div class="sh"><div class="grow"><span class="no">${String(n).padStart(2, '0')} / ${String(TOTAL).padStart(2, '0')}</span><h2>${en}</h2><span class="cn">${cn}</span></div><div class="meta">${meta}</div></div>`;
const foot = (l) => `<div class="foot"><span>PROOF OF SKILL · PLAN B · INTERACTION SPEC</span><span>${l}</span></div>`;
const keyChips = page => KEYS.filter(k => k.page.split(' · ').includes(page)).map(k => `<span class="kb">${k.k}</span> ${k.name}`).join('&nbsp;&nbsp;&nbsp;');

const slides = [];
slides.push({ id: 'cover', html: `
  <div class="cover-l"><span class="k">PLAN B · ANNOTATED INTERACTION SPEC · v1.0 · 23 OCT 2026</span>
    <h2>Proof<br>of <em>Skill</em></h2>
    <p>Students submit a GitHub project, an agent verifies it, an AI interviewer tests how well they can explain it, and verified skills help them find teammates.</p>
    <p class="cn">面向大学社团：用真实项目证明能力，用 AI 模拟面试练习表达，再用已验证的技能找到互补的队友。</p></div>
  <div class="cover-r"><div class="idx">
    <div><b>02</b><span>User flow</span><span>页面流转</span></div>
    ${PAGES.map((p, i) => `<div><b>${String(i + 3).padStart(2, '0')}</b><span>${p.code} · ${p.en}</span><span>${p.cn}</span></div>`).join('')}
    <div><b>08</b><span>Key buttons & states</span><span>按钮状态表</span></div></div>
    <div class="keybox">
      <div><span class="pin entry">1</span><span>Entry<br><small>进入新页面或新流程</small></span></div>
      <div><span class="pin exit">2</span><span>Exit<br><small>离开当前流程或页面</small></span></div>
      <div><span class="pin func">3</span><span>Function<br><small>在本页完成操作</small></span></div>
      <div><span class="pin func key">4</span><span>Key button <span class="kb">K1–K7</span><br><small>7 个关键操作按钮</small></span></div>
    </div></div>
  ${foot('UI: ENGLISH · NOTES: 中文')}` });

slides.push({ id: 'flow', html: head(2, 'User flow', '页面流转：7 个关键按钮如何连接 5 个页面', 'SOLID = ENTRY · DASHED = EXIT<br>LOOP = STAYS ON PAGE') + `<svg class="flowsvg" viewBox="0 0 1504 560" aria-label="Flow between the five pages"></svg>
  <div class="guards">
    <div><h4>Guards · 页面解锁规则</h4><p><code>P2</code> 需要先提交项目；<code>P3 P4 P5</code> 需要验证完成。锁住的步骤点击后弹出提示，不跳转。</p></div>
    <div><h4>Errors · 出错时</h4><p>任何请求失败都留在当前页：红色提示框说明原因，配 <code>Try again</code>。轮询验证进度失败会自动重试 3 次。</p></div>
    <div><h4>Global exits · 全局出口</h4><p>品牌标志 → <code>P1</code>；顶部步骤导航可以回到任何已解锁的页面；<code>Submit another</code> 清空当前项目。</p></div>
  </div>${foot('FLOW')}` });

PAGES.forEach((p, i) => slides.push({ id: p.hash, page: p.code, html: head(i + 3, `${p.code} · ${p.en}`, p.cn, keyChips(p.code)) + SCREENS[p.code]() + `<div class="ann">${annList(p.code)}</div><div class="pins"></div>` + foot(`#${p.hash}`) }));

slides.push({ id: 'states', html: head(8, 'Key buttons & states', '7 个关键按钮：触发方式、加载、成功、出错与接口') + `<table class="matrix"><thead><tr><th>Button</th><th>Trigger</th><th>Loading</th><th>Success</th><th>Error</th><th>API</th></tr></thead><tbody>
  ${KEYS.map(k => `<tr><td><span class="kb">${k.k}</span> <code>${k.page}</code><span class="bn">${k.name}</span><span class="cn">${k.cn}</span></td><td>${k.trig}</td><td class="ld">${k.ld}</td><td class="ok">${k.ok}</td><td class="er">${k.er}</td><td><code>${k.api}</code></td></tr>`).join('')}
  </tbody></table>${foot('STATES')}` });

const deck = document.getElementById('deck');
deck.innerHTML = slides.map((s, i) => `<section class="frame" id="w-${s.id}"><div class="slide" data-i="${i}" ${s.page ? `data-page="${s.page}"` : ''} role="region" aria-label="Slide ${i + 1}">${s.html}</div></section>`).join('');

const svg = deck.querySelector('.flowsvg');
(() => {
  const X = [112, 432, 752, 1072, 1392], Y = 250, W = 210, H = 96;
  const C = { entry: 'var(--entry)', exit: 'var(--exit)', func: 'var(--func)', key: 'var(--key)' };
  let s = `<defs>${['entry', 'exit', 'func'].map(t => `<marker id="m-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C[t]}"/></marker>`).join('')}</defs>`;
  const kb = (x, y, k) => `<g><rect x="${x - (12 + k.length * 4)}" y="${y - 12}" width="${24 + k.length * 8}" height="22" rx="5" fill="var(--key)"/><text x="${x}" y="${y + 4}" text-anchor="middle" class="lbl" style="fill:#1b1205;font-size:12px">${k}</text></g>`;
  const fwd = (a, b, k, label, dy = 0) => {
    const x1 = X[a] + W / 2, x2 = X[b] - W / 2, y = Y + dy;
    s += `<line x1="${x1 + 4}" y1="${y}" x2="${x2 - 6}" y2="${y}" stroke="var(--entry)" stroke-width="2.5" marker-end="url(#m-entry)"/>`;
    const mx = (x1 + x2) / 2;
    if (k) s += kb(mx, y - 22, k);
    s += `<text x="${mx}" y="${y + 24}" text-anchor="middle" class="lbl" style="fill:var(--entry);font-size:11.5px">${label}</text>`;
  };
  fwd(0, 1, 'K1', 'Submit');
  fwd(1, 2, '', 'Continue');
  fwd(2, 3, 'K4 K5', 'Report · Skills');
  fwd(3, 4, 'K6', 'Find');
  const arcUp = (a, b, k, label, h) => {
    const x1 = X[a], x2 = X[b], y = Y - H / 2;
    s += `<path d="M${x1} ${y - 2} C ${x1} ${y - h}, ${x2} ${y - h}, ${x2} ${y - 8}" fill="none" stroke="var(--entry)" stroke-width="2.5" marker-end="url(#m-entry)"/>`;
    const mx = (x1 + x2) / 2, my = y - h * .75;
    s += kb(mx - 110, my - 30, k) + `<text x="${mx - 80}" y="${my - 26}" class="lbl" style="fill:var(--entry);font-size:11.5px">${label}</text>`;
  };
  arcUp(1, 3, 'K4', 'View Verification Report', 150);
  const loop = (i, k, label, sub) => {
    const x = X[i], y = Y + H / 2;
    s += `<path d="M${x - 34} ${y + 2} C ${x - 60} ${y + 70}, ${x + 60} ${y + 70}, ${x + 34} ${y + 8}" fill="none" stroke="var(--func)" stroke-width="2.5" marker-end="url(#m-func)"/>`;
    s += kb(x, y + 78, k) + `<text x="${x}" y="${y + 108}" text-anchor="middle" class="lbl" style="fill:var(--func);font-size:11.5px">${label}</text><text x="${x}" y="${y + 126}" text-anchor="middle" class="cn" style="font-size:12px">${sub}</text>`;
  };
  loop(1, 'K2', 'Start Verification', '轮询直到完成');
  loop(2, 'K3', 'Submit Answer', '× 5 题');
  loop(4, 'K7', 'Join / Leave Matching', '切换匹配状态');
  const back = (a, b, label, depth) => {
    const x1 = X[a] - 30, x2 = X[b] + 30, y = Y + H / 2;
    s += `<path d="M${x1} ${y + 2} C ${x1} ${y + depth}, ${x2} ${y + depth}, ${x2} ${y + 10}" fill="none" stroke="var(--exit)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m-exit)"/>`;
    s += `<text x="${(x1 + x2) / 2}" y="${y + depth * .78 + 16}" text-anchor="middle" class="lbl" style="fill:var(--exit);font-size:11.5px">${label}</text>`;
  };
  back(1, 0, 'Submit another', 120);
  back(4, 0, 'Brand logo → Homepage', 250);
  PAGES.forEach((p, i) => {
    s += `<g><rect x="${X[i] - W / 2}" y="${Y - H / 2}" width="${W}" height="${H}" rx="14" fill="var(--sheet)" stroke="var(--ink)" stroke-width="2"/>
      <text x="${X[i]}" y="${Y - 14}" text-anchor="middle" class="lbl" style="fill:var(--ink-3)">${p.code}</text>
      <text x="${X[i]}" y="${Y + 8}" text-anchor="middle" style="font:700 17px var(--f-display);fill:var(--ink)">${p.en}</text>
      <text x="${X[i]}" y="${Y + 30}" text-anchor="middle" class="cn">${p.cn}</text></g>`;
  });
  svg.innerHTML = s;
})();

const st = { ann: true, show: { entry: true, exit: true, func: true }, cur: 0 };
const frames = [...deck.querySelectorAll('.frame')];

function fit() {
  frames.forEach(f => {
    const sc = f.clientWidth / 1600;
    const sl = f.firstElementChild;
    sl.style.transform = `scale(${sc})`;
    sl.dataset.sc = sc;
    f.style.height = (900 * sc) + 'px';
  });
}
function placePins() {
  deck.querySelectorAll('.slide[data-page]').forEach(sl => {
    const sc = +sl.dataset.sc || 1, base = sl.getBoundingClientRect(), page = sl.dataset.page;
    const layer = sl.querySelector('.pins');
    layer.innerHTML = '';
    const rows = Object.fromEntries(A[page].map(r => [r.id, r]));
    sl.querySelectorAll('[data-pin]').forEach(el => {
      const r = rows[el.dataset.pin]; if (!r) return;
      el.classList.add('t-' + r.t);
      if (!st.show[r.t]) return;
      const b = el.getBoundingClientRect();
      const pin = document.createElement('span');
      pin.className = `pin ${r.t} ${r.key ? 'key' : ''}`;
      pin.textContent = r.id; pin.dataset.id = r.id;
      pin.style.left = ((b.right - base.left) / sc - 2) + 'px';
      pin.style.top = ((b.top - base.top) / sc + 2) + 'px';
      pin.addEventListener('mouseenter', () => hot(sl, r.id, true));
      pin.addEventListener('mouseleave', () => hot(sl, r.id, false));
      layer.appendChild(pin);
    });
  });
}
function hot(sl, id, on) {
  sl.querySelectorAll(`.pins .pin[data-id="${id}"]`).forEach(p => p.classList.toggle('hot', on));
  sl.querySelectorAll(`.arow[data-id="${id}"]`).forEach(p => p.classList.toggle('hot', on));
  sl.querySelectorAll(`[data-pin="${id}"]`).forEach(p => p.classList.toggle('flash', on));
}
deck.querySelectorAll('.arow').forEach(r => {
  const sl = r.closest('.slide');
  r.addEventListener('mouseenter', () => hot(sl, r.dataset.id, true));
  r.addEventListener('mouseleave', () => hot(sl, r.dataset.id, false));
});
function applyFilters() {
  deck.querySelectorAll('.slide').forEach(sl => {
    sl.classList.toggle('annoff', !st.ann);
    ['entry', 'exit', 'func'].forEach(t => sl.classList.toggle('hide-' + t, !st.show[t]));
  });
  deck.querySelectorAll('.arow').forEach(r => r.classList.toggle('off', !st.show[r.dataset.t]));
  placePins();
}
document.getElementById('annT').addEventListener('click', e => { st.ann = !st.ann; e.currentTarget.setAttribute('aria-pressed', st.ann); applyFilters(); });
document.querySelectorAll('.tg[data-type]').forEach(b => b.addEventListener('click', () => { const t = b.dataset.type; st.show[t] = !st.show[t]; b.setAttribute('aria-pressed', st.show[t]); applyFilters(); }));

const count = document.getElementById('count');
function setCur(i, scroll) {
  st.cur = Math.max(0, Math.min(frames.length - 1, i));
  frames.forEach((f, k) => f.firstElementChild.classList.toggle('cur', k === st.cur && scroll !== null));
  count.textContent = `${st.cur + 1} / ${frames.length}`;
  if (scroll) {
    const y = frames[st.cur].getBoundingClientRect().top + scrollY - 70;
    scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    try { history.replaceState(null, '', '#' + slides[st.cur].id); } catch (e) {}
  }
}
document.getElementById('prev').addEventListener('click', () => setCur(st.cur - 1, true));
document.getElementById('next').addEventListener('click', () => setCur(st.cur + 1, true));
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); setCur(st.cur + 1, true); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); setCur(st.cur - 1, true); }
});
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > .55) { const i = frames.indexOf(e.target); if (i !== st.cur) { st.cur = i; count.textContent = `${i + 1} / ${frames.length}`; frames.forEach((f, k) => f.firstElementChild.classList.remove('cur')); } } });
}, { threshold: [.55] }) : null;
frames.forEach(f => io?.observe(f));

let raf; addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { fit(); placePins(); }); });
fit(); placePins();
document.fonts?.ready.then(() => { fit(); placePins(); });
const h = (location.hash || '').slice(1);
const start = slides.findIndex(s => s.id === h);
if (start > 0) requestAnimationFrame(() => setCur(start, true));
})();
</script>

</body>
